# On the server: `docker compose pull && docker compose up -d`.
#
# Set IMAGE to the package this repository publishes, e.g.
#   IMAGE=ghcr.io/<you>/telegram-live-location:main
services:
  app:
    image: ${IMAGE:-ghcr.io/OWNER/telegram-live-location:main}
    restart: unless-stopped
    # Secrets live on the server, never in this file and never in the image.
    env_file:
      - /etc/telegram-live-location.env
    # Bound to loopback on purpose: put a TLS terminator in front rather than
    # exposing a dashboard of people's locations straight to the internet.
    ports:
      # Loopback unless deliberately changed. BIND=0.0.0.0 is the single act
      # that exposes this to the internet, and it belongs in the .env file
      # beside this one — Compose substitutes from there, never from the
      # env_file above, which is only the container's own environment.
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      # Tiles are slow to fetch and cheap to keep; losing them on every deploy
      # would hammer OpenStreetMap for no reason.
      - tiles:/tmp/livegeo-tiles
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      postgis:
        condition: service_healthy
        # Not started unless the postgis profile is on, and the app is built to
        # run without it. Without `required: false` a deploy on a server that
        # has not opted in would fail to start the app at all.
        required: false

  # Optional: a way in that never opens a way in. cloudflared dials *out* to
  # Cloudflare and requests arrive back down that connection, so the app keeps
  # its loopback binding, nothing is published to the internet, and the
  # question of whether ufw can filter a Docker port stops mattering. It also
  # puts TLS on the hop this service cannot terminate itself, having no
  # certificate and no name to get one for.
  #
  #   docker compose --profile tunnel up -d
  #   docker compose logs tunnel | grep -o 'https://.*trycloudflare.com'
  #
  # Left alone this is a quick tunnel: no account, no domain, and a new random
  # hostname every time it restarts. Set TUNNEL_TOKEN and TUNNEL_ARGS=run for
  # your own named tunnel on your own hostname, which is the version to trust
  # with anything lasting.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    # The default is the quick tunnel's `--url http://app:8080`; reaching the
    # app by service name is why no port needs publishing at all.
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-auto} ${TUNNEL_ARGS:---url http://app:8080}
    environment:
      # Empty for a quick tunnel. cloudflared ignores it when it is blank.
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional: without DATABASE_URL in the env file the app ignores this and
  # runs exactly as it did before. Bound to loopback for the same reason the
  # dashboard is — nothing here belongs on the open internet.
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    # Off unless asked for. `docker compose up -d` on a server that has not run
    # bin/setup-postgis.sh leaves this alone entirely, which is what keeps a
    # deploy from breaking on a missing POSTGRES_PASSWORD.
    profiles: ["postgis"]
    env_file:
      - /etc/telegram-live-location.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livegeo}
      POSTGRES_USER: ${POSTGRES_USER:-livegeo}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livegeo} -d ${POSTGRES_DB:-livegeo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  tiles:
