<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LiveGeo</title>
<!-- Served from this host. Nothing on this page reaches a third party: on a
     network that filters things, a CDN is one more way for the map to vanish. -->
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="/lib/people-map.css" />
<style>
  :root{
    --ink:#14181d; --paper:#fff; --quiet:#6b7480; --hairline:#e3e6ea;
    --live:#0a7d33; --stale:#9aa3ad;
    /* You, among everyone else: blue while you share, paler once you stop. */
    --me:#1a73e8; --me-stale:#6f8fc2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8eaed; --paper:#14181d; --quiet:#9aa3ad; --hairline:#2a2f36; --me:#8ab4f8; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--paper);
    height:100svh;display:grid;grid-template-rows:auto 1fr;
  }
  header{
    display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
    padding:.7rem 1rem;border-bottom:1px solid var(--hairline);
  }
  h1{font-size:1rem;font-weight:600;letter-spacing:-.01em}
  .count{color:var(--quiet);font-size:.85rem}
  .conn{
    margin-left:auto;display:inline-flex;align-items:center;gap:.4rem;
    font-size:.8rem;color:var(--quiet);
  }
  .conn i{width:.5rem;height:.5rem;border-radius:50%;background:var(--stale);display:block}
  .conn.up i{background:var(--live)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 19rem;min-height:0}
  @media (max-width:760px){ main{grid-template-columns:1fr;grid-template-rows:1fr auto} }
  #map{height:100%;width:100%;background:var(--paper)}
  @media (prefers-color-scheme: dark){
    .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
  }
  aside{
    border-left:1px solid var(--hairline);overflow-y:auto;padding:.5rem;
    display:flex;flex-direction:column;gap:.4rem;
  }
  @media (max-width:760px){ aside{border-left:none;border-top:1px solid var(--hairline);max-height:38vh} }
  .person{
    border:1px solid var(--hairline);border-radius:10px;padding:.6rem .7rem;
    cursor:pointer;background:none;color:inherit;text-align:left;font:inherit;
    display:grid;gap:.15rem;
  }
  .person:hover{border-color:var(--quiet)}
  .person .who{display:flex;align-items:center;gap:.4rem;font-weight:600}
  .person .who i{width:.5rem;height:.5rem;border-radius:50%;background:var(--stale);flex:none}
  .person.live .who i{background:var(--live);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){ .person.live .who i{animation:none} }
  .person .meta{font-size:.8rem;color:var(--quiet);font-variant-numeric:tabular-nums}
  .empty{color:var(--quiet);font-size:.88rem;padding:1rem;text-align:center}
  /* Spotlight: the map recedes so one path can be read against it. The dark
     theme already filters the tiles, so its rule has to carry both. */
  .leaflet-tile-pane{transition:filter .18s ease}
  body.spotlight .leaflet-tile-pane{filter:grayscale(.8) opacity(.4)}
  @media (prefers-color-scheme: dark){
    body.spotlight .leaflet-tile-pane{
      filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) grayscale(.8) opacity(.4);
    }
  }
  body.spotlight .person{opacity:.45;transition:opacity .18s ease}
  body.spotlight .person.lit{opacity:1;border-color:var(--ink)}
  .person.lit{border-color:var(--ink)}

  .ghost{
    font:inherit;font-size:.8rem;color:var(--quiet);background:none;cursor:pointer;
    border:1px solid var(--hairline);border-radius:999px;padding:.15rem .6rem;
  }
  .ghost:hover{border-color:var(--quiet);color:var(--ink)}
  .card .ghost.share{margin-top:.45rem}
  .shared{margin-top:.45rem;display:grid;gap:.2rem}
  .shared input{
    font:inherit;font-size:.78rem;width:100%;padding:.25rem .4rem;
    border:1px solid var(--hairline);border-radius:6px;background:var(--paper);color:var(--ink);
  }
  .shared .meta{font-size:.72rem;color:var(--quiet)}
  /* The card behind a marker: a face and a handle, so a dot stops being a number. */
  .card{display:flex;gap:.6rem;align-items:center;min-width:11rem}
  .card img,.card .noface{
    width:3rem;height:3rem;border-radius:50%;flex:none;object-fit:cover;
    background:var(--hairline);display:grid;place-items:center;
    font-weight:600;color:var(--quiet);
  }
  .card .cname{font-weight:600;line-height:1.3}
  .card .chandle{font-size:.82rem;color:var(--quiet)}
  .card .cid{font-size:.75rem;color:var(--quiet);font-variant-numeric:tabular-nums;opacity:.7}
  .leaflet-popup-content{margin:.7rem .8rem}
  /* The time under the pointer. A label, not a card: it follows the cursor. */
  .time-tip{font:600 .78rem/1.3 ui-sans-serif,system-ui,sans-serif;padding:.2rem .45rem;
            border-radius:.35rem;white-space:nowrap}
  .time-tip .quiet{font-weight:400;opacity:.7}
  /* A fence is a place, not a person: drawn quietly, under everything else. */
  .fencing #map{cursor:crosshair}
  .fencing #newfence{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .fence-label{font-size:.72rem;font-weight:600;color:var(--quiet);
               background:none;border:none;box-shadow:none;padding:0}
  /* Who can see you. A panel over the map rather than a page: it is a thing
     you check and close, not somewhere you go. */
  #circle{position:fixed;top:3.4rem;right:1rem;z-index:1000;width:min(22rem,calc(100vw - 2rem));
          background:var(--paper);border:1px solid var(--hairline);border-radius:.6rem;
          box-shadow:0 8px 30px rgba(0,0,0,.12);padding:1rem;max-height:70svh;overflow:auto}
  #circle h2{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
             color:var(--quiet);margin:.9rem 0 .4rem}
  #circle h2:first-child{margin-top:0}
  #circle .row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.3rem 0}
  #circle .none{color:var(--quiet);font-size:.88rem}
  #circle .invite{display:flex;gap:.4rem;margin-top:.5rem}
  #circle .invite input{flex:1;min-width:0;font:inherit;font-size:.8rem;padding:.3rem .45rem;
                        border:1px solid var(--hairline);border-radius:.35rem;background:var(--paper);color:var(--ink)}
  #circle .fine{color:var(--quiet);font-size:.78rem;margin-top:.5rem}
  #circle .code{font:600 1.6rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;margin:.4rem 0}
  /* The blur, the glide and the beam are in /lib/people-map.css, shared with
     the page a live link opens. */
  /* Where a path goes out of view, or comes back into it. */
  .fade-end{width:22px;height:22px;border-radius:50%;filter:blur(2px);opacity:.65}
  /* A day of your own path, to take away as GPX. */
  .card .gpx{display:flex;align-items:center;gap:.35rem;margin-top:.45rem;flex-wrap:wrap}
  .card .gpx input{font:inherit;font-size:.78rem;padding:.12rem .3rem;border:1px solid var(--hairline);
    border-radius:6px;background:var(--paper);color:var(--ink)}
  /* Follow me: a live link from your own card. */
  .card .follow{display:flex;align-items:center;gap:.3rem;margin-top:.45rem;flex-wrap:wrap}
  /* Somebody who asked for help. */
  .person.sos{border-color:#d93025;box-shadow:0 0 0 2px rgba(217,48,37,.18)}
  .person.sos .who i{background:#d93025;animation:pulse .9s ease-in-out infinite}
  .person.sos .meta.alarm{color:#d93025;font-weight:600}
  @media (prefers-reduced-motion:reduce){ .person.sos .who i{animation:none} }
  /* You. Blue on the map and here, and said in words too; an SOS stays red. */
  .person.me:not(.sos) .who i{background:var(--me-stale)}
  .person.me.live:not(.sos) .who i{background:var(--me)}
  .person .you{font-size:.7rem;font-weight:600;color:var(--me);border:1px solid currentColor;
    border-radius:999px;padding:0 .4rem;line-height:1.5}
  .card .sosline{display:flex;align-items:center;gap:.35rem;margin-top:.45rem;flex-wrap:wrap}
  .ghost.sosbtn{color:#d93025;border-color:rgba(217,48,37,.5);font-weight:600}
  .ghost.sosbtn:hover{background:#d93025;color:#fff;border-color:#d93025}
  header .hint{font-size:.8rem;color:var(--quiet)}
  header .spacer{flex:1}
  header a.ghost{text-decoration:none;color:inherit}

  /* Mature cartographic direction: quiet chrome, strong map hierarchy. */
  :root{
    --ink:#f1ede7;
    --paper:#0b1419;
    --quiet:#92a0a5;
    --hairline:rgba(255,255,255,.11);
    --panel:rgba(7,14,18,.90);
    --panel-solid:#0c171d;
    --panel-hover:#13242c;
    --map-bg:#0d1d24;
    --live:#40e38f;
    --stale:#78868c;
    --me:#4cb5ff;
    --me-stale:#7499b4;
    --accent:#d85691;
    --danger:#ff5a62;
  }

  body{
    color:var(--ink);
    background:var(--paper);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  header{
    min-height:52px;
    padding:.55rem .8rem;
    gap:.55rem;
    background:rgba(6,13,17,.97);
    border-bottom:1px solid var(--hairline);
    box-shadow:0 1px 0 rgba(0,0,0,.35);
    z-index:1200;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:.65rem;
    min-width:max-content;
  }
  .brand h1{
    font-size:.78rem;
    font-weight:800;
    letter-spacing:.18em;
    color:#f7f4ef;
  }
  .brand .city{
    font-size:.72rem;
    font-weight:650;
    letter-spacing:.12em;
    color:var(--quiet);
  }
  .count{font-size:.75rem;color:var(--quiet)}

  .ghost{
    min-height:30px;
    padding:.24rem .58rem;
    border:1px solid var(--hairline);
    border-radius:6px;
    background:rgba(255,255,255,.025);
    color:#aeb9bc;
    font-size:.76rem;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .ghost:hover{
    background:rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.22);
    color:var(--ink);
  }

  .conn{
    margin-left:.2rem;
    padding-left:.35rem;
    color:var(--quiet);
    font-size:.74rem;
  }
  .conn i{width:.42rem;height:.42rem;box-shadow:0 0 0 3px rgba(255,255,255,.035)}
  .conn.up i{background:var(--live);box-shadow:0 0 0 3px rgba(64,227,143,.10)}

  main{
    grid-template-columns:minmax(0,1fr) 17.5rem;
    background:var(--map-bg);
  }

  .map-shell{
    position:relative;
    min-width:0;
    min-height:0;
    overflow:hidden;
    background:var(--map-bg);
  }
  .map-shell #map{position:absolute;inset:0;background:var(--map-bg)}


  aside{
    background:var(--panel-solid);
    border-left:1px solid var(--hairline);
    padding:.55rem;
    gap:.35rem;
  }

  .person{
    border:1px solid rgba(255,255,255,.085);
    border-radius:6px;
    padding:.58rem .62rem;
    background:rgba(255,255,255,.018);
    transition:background .15s ease,border-color .15s ease,opacity .15s ease;
  }
  .person:hover{
    background:rgba(255,255,255,.045);
    border-color:rgba(255,255,255,.18);
  }
  .person.lit{
    background:rgba(255,255,255,.065);
    border-color:rgba(255,255,255,.28);
  }
  .person .who{font-size:.82rem;letter-spacing:.005em}
  .person .meta{font-size:.72rem;color:#849398}
  .person .you{
    border-radius:4px;
    padding:.02rem .32rem;
    font-size:.61rem;
    letter-spacing:.04em;
  }
  .person.sos{
    border-color:rgba(255,90,98,.72);
    box-shadow:inset 2px 0 0 var(--danger);
  }

  #circle{
    top:3.6rem;
    right:.8rem;
    width:min(22rem,calc(100vw - 1.6rem));
    background:var(--panel);
    border:1px solid rgba(255,255,255,.12);
    border-radius:7px;
    box-shadow:0 14px 42px rgba(0,0,0,.42);
    backdrop-filter:blur(14px);
  }
  #circle h2{color:#9eaaae}

  .leaflet-tile-pane{
    filter:invert(.94) hue-rotate(154deg) saturate(.76) brightness(.80) contrast(1.06);
    transition:filter .18s ease;
  }
  body.spotlight .leaflet-tile-pane{
    filter:invert(.94) hue-rotate(154deg) saturate(.54) brightness(.62) contrast(1.08) grayscale(.30) opacity(.78);
  }

  .leaflet-control-zoom a{
    color:#d6dddf;
    background:rgba(6,14,18,.90);
    border-color:rgba(255,255,255,.10);
  }
  .leaflet-control-zoom a:hover{background:#13242c;color:#fff}
  .leaflet-control-attribution{
    background:rgba(6,14,18,.68)!important;
    color:#8e9b9f;
    font-size:10px;
  }
  .leaflet-control-attribution a{color:#b9c5c8}

  .leaflet-control-scale{margin:0 0 17px 17px}
  .leaflet-control-scale-line{
    min-width:74px;
    border:0;
    border-bottom:2px solid rgba(245,241,236,.92);
    background:transparent;
    color:#f5f1ec;
    padding:0 4px 4px;
    font:600 10px/1 ui-sans-serif,system-ui,sans-serif;
    text-align:right;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
    box-shadow:none;
  }

  .leaflet-popup-content-wrapper,
  .leaflet-popup-tip{
    background:rgba(8,16,21,.96);
    color:var(--ink);
    box-shadow:0 12px 28px rgba(0,0,0,.42);
  }
  .leaflet-popup-content-wrapper{
    border:1px solid rgba(255,255,255,.11);
    border-radius:7px;
  }
  .leaflet-popup-close-button{color:#9aa8ac!important}

  .card .cname{font-size:.86rem}
  .card .chandle,.card .cid{color:#87969b}

  @media (max-width:760px){
    header{padding:.45rem .55rem}
    .brand{gap:.45rem}
    .brand .city{display:none}
    main{grid-template-columns:1fr;grid-template-rows:1fr auto}
    aside{max-height:34vh}
    .leaflet-control-scale{margin-left:10px;margin-bottom:10px}
  }

  /* Phase 2: the map is the product. Panels float over a full-width canvas. */
  body{overflow:hidden}
  main{position:relative;display:block;min-height:0;overflow:hidden}
  .map-shell{position:absolute;inset:0}
  .map-toolbar{
    position:absolute;z-index:820;top:1rem;right:1rem;
    display:flex;align-items:center;gap:.35rem
  }
  .map-toolbar .ghost{
    background:rgba(7,14,18,.88);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 20px rgba(0,0,0,.18)
  }
  #peoplebadge{
    display:inline-grid;place-items:center;min-width:1.15rem;height:1.15rem;margin-left:.25rem;
    padding:0 .25rem;border-radius:4px;background:rgba(255,255,255,.08);
    color:#d9e1e3;font-size:.63rem;font-variant-numeric:tabular-nums
  }
  #peoplebadge:empty{display:none}

  .people-panel,.detail-panel,.layers-panel{
    position:absolute;z-index:810;
    background:rgba(7,14,18,.86);
    border:1px solid rgba(255,255,255,.11);
    border-radius:7px;
    box-shadow:0 18px 48px rgba(0,0,0,.38);
    backdrop-filter:blur(14px)
  }
  .people-panel{
    left:1rem;top:4.65rem;bottom:1rem;width:min(17rem,calc(100vw - 2rem));
    padding:0;display:flex;flex-direction:column;overflow:hidden;
    transform:translateX(calc(-100% - 1.4rem));opacity:0;pointer-events:none;
    transition:transform .2s ease,opacity .16s ease
  }
  .people-panel.is-open{transform:none;opacity:1;pointer-events:auto}
  .panel-heading{
    display:flex;align-items:center;gap:.5rem;min-height:43px;padding:.55rem .65rem;
    border-bottom:1px solid rgba(255,255,255,.08)
  }
  .panel-heading strong{font-size:.74rem;letter-spacing:.11em;text-transform:uppercase}
  .panel-heading .panel-meta{margin-left:auto;color:var(--quiet);font-size:.68rem}
  .panel-close{
    width:28px;height:28px;padding:0;display:grid;place-items:center;
    border:1px solid transparent;border-radius:5px;background:transparent;color:#89979b;cursor:pointer
  }
  .panel-close:hover{border-color:var(--hairline);background:rgba(255,255,255,.045);color:#fff}
  #list{overflow:auto;padding:.45rem;display:flex;flex-direction:column;gap:.32rem}
  #list .empty{padding:1.3rem .7rem;color:#7f8e93}

  .detail-panel{right:1rem;top:4.65rem;width:min(21rem,calc(100vw - 2rem));padding:.7rem}
  .detail-panel[hidden],.layers-panel[hidden]{display:none}
  .detail-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem;
    padding-bottom:.5rem;border-bottom:1px solid rgba(255,255,255,.08)
  }
  .detail-head span{font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;color:#8e9ba0}
  .detail-panel .card{display:grid;grid-template-columns:3rem 1fr;align-items:start;gap:.7rem;min-width:0}
  .detail-panel .card>div:last-child{min-width:0}
  .detail-panel .card .shared input{background:#081116}
  .detail-panel .card .follow,.detail-panel .card .gpx,.detail-panel .card .sosline{margin-top:.65rem}

  .layers-panel{right:1rem;top:4.65rem;width:15.5rem;padding:.72rem}
  .layers-title{
    margin-bottom:.55rem;padding-bottom:.5rem;border-bottom:1px solid rgba(255,255,255,.08);
    font-size:.68rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#98a5a9
  }
  .layer-option{
    display:flex;align-items:center;gap:.65rem;padding:.5rem .2rem;
    color:#d2d9db;font-size:.76rem;cursor:pointer
  }
  .layer-option+ .layer-option{border-top:1px solid rgba(255,255,255,.045)}
  .layer-option input{accent-color:var(--accent)}
  .layer-option small{display:block;margin-left:auto;color:#74858a;font-size:.62rem}

  /* Raster supplies labels; the PostGIS SVG pane adds independent feature
     styling over it. Keeping them in separate panes lets Layers toggle either. */
  .leaflet-cartography-pane{pointer-events:none}
  .leaflet-cartography-pane .leaflet-tile{image-rendering:auto}
  body.spotlight .leaflet-cartography-pane{opacity:.52;transition:opacity .18s ease}

  .person .who i{width:.48rem;height:.48rem}
  .person.live .who i{box-shadow:0 0 0 3px rgba(64,227,143,.08)}
  .person.me.live:not(.sos) .who i{box-shadow:0 0 0 3px rgba(76,181,255,.11)}
  .person.sos .who i{box-shadow:0 0 0 3px rgba(255,90,98,.12)}

  @media (max-width:760px){
    .map-toolbar{top:.7rem;right:.7rem}
    .map-toolbar .ghost{min-height:32px}
    .people-panel{
      left:.55rem;right:.55rem;bottom:.55rem;top:auto;width:auto;max-height:43vh;
      transform:translateY(calc(100% + 1rem))
    }
    .people-panel.is-open{transform:none}
    .detail-panel{
      left:.55rem;right:.55rem;top:auto;bottom:.55rem;width:auto;max-height:58vh;overflow:auto
    }
    .layers-panel{right:.55rem;top:4.25rem;width:min(15.5rem,calc(100vw - 1.1rem))}
  }

</style>
</head>
<body>
<header>
  <div class="brand"><h1>LIVEGEO</h1></div>
  <span class="count" id="count"></span>
  <span class="hint" id="hint" hidden></span>
  <button class="ghost" id="newfence" type="button" hidden>New fence</button>
  <button class="ghost" id="circlebtn" type="button" hidden>Circle</button>
  <span class="spacer"></span>
  <a class="ghost" id="signout" href="/auth/logout" hidden>Sign out</a>
  <span class="conn" id="conn"><i></i><span>connecting…</span></span>
</header>
<div id="circle" hidden></div>
<main>
  <div class="map-shell">
    <div id="map"></div>
    <div class="map-toolbar" aria-label="Map controls">
      <button class="ghost" id="peoplebtn" type="button" aria-expanded="false">People <span id="peoplebadge"></span></button>
      <button class="ghost" id="layersbtn" type="button" aria-expanded="false">Layers</button>
      <button class="ghost" id="recentre" type="button" hidden>Recentre</button>
    </div>

    <aside class="people-panel" id="peoplePanel" aria-label="People">
      <div class="panel-heading">
        <strong>People</strong>
        <span class="panel-meta" id="panelcount"></span>
        <button class="panel-close" id="peopleclose" type="button" aria-label="Close people panel">×</button>
      </div>
      <div id="list"><p class="empty">Nobody is sharing a location yet.</p></div>
    </aside>

    <section class="detail-panel" id="detailPanel" aria-label="Person details" hidden></section>

    <section class="layers-panel" id="layersPanel" aria-label="Map layers" hidden>
      <div class="layers-title">Map layers</div>
      <label class="layer-option"><input type="checkbox" data-layer="cartography" checked><span>Styled cartography</span><small>PostGIS</small></label>
      <label class="layer-option"><input type="checkbox" data-layer="raster" checked><span>Base labels</span><small>OSM</small></label>
      <label class="layer-option"><input type="checkbox" data-layer="trails" checked><span>Movement trails</span></label>
      <label class="layer-option"><input type="checkbox" data-layer="fences" checked><span>Geofences</span></label>
      <label class="layer-option"><input type="checkbox" data-layer="zones" checked><span>Private places</span></label>
    </section>
  </div>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/lib/path-time.js"></script>
<script src="/lib/people-map.js"></script>
<script>
(function () {
  var map = L.map('map', {
    zoomControl: true,
    // Pan past the dateline and the world keeps going, with the markers
    // following you into the copy you are looking at.
    worldCopyJump: true,
    // Far enough out to see a continent, never so far that the whole world
    // shrinks into a band with empty space above and below it.
    minZoom: 3
  }).setView([20, 0], 3);

  // Proxied and cached by this service rather than fetched from OSM directly,
  // so the browser only ever talks to the host it loaded the page from. The
  // attribution stays either way — it is a condition of using the data, not a
  // consequence of where the bytes came from.
  var rasterBase = L.tileLayer('/tiles/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  // Transparent SVG geometry rendered from the same local osm2pgsql extract
  // PostGIS already uses for place names. The raster stays underneath for
  // labels; roads, parks, water, rail and buildings can now be styled
  // independently instead of recolouring one PNG.
  map.createPane('cartography');
  map.getPane('cartography').style.zIndex = 250;
  map.getPane('cartography').style.pointerEvents = 'none';
  var cartography = L.tileLayer('/carto/{z}/{x}/{y}.svg', {
    pane: 'cartography',
    maxZoom: 19,
    minZoom: 3,
    opacity: 1
  }).addTo(map);

  var layerPrefs = { raster: true, cartography: true, trails: true, fences: true, zones: true };

  // A real geographic scale. Leaflet recomputes this from zoom and latitude,
  // so the number always corresponds to the map instead of being decorative.
  L.control.scale({
    position: 'bottomleft',
    metric: true,
    imperial: false,
    maxWidth: 180
  }).addTo(map);

  // How a person is drawn — the blur over somebody in a private place, the
  // dot gliding to where they are now, the beam for the way they are heading
  // — is shared with the page a live link opens. See /lib/people-map.js.
  var drawing = PeopleMap.on(map);

  var peoplePanel = document.getElementById('peoplePanel');
  var peopleButton = document.getElementById('peoplebtn');
  var layersPanel = document.getElementById('layersPanel');
  var layersButton = document.getElementById('layersbtn');
  var detailPanel = document.getElementById('detailPanel');

  function setPeopleOpen(open) {
    peoplePanel.classList.toggle('is-open', open);
    peopleButton.setAttribute('aria-expanded', String(open));
  }
  peopleButton.onclick = function () {
    setPeopleOpen(!peoplePanel.classList.contains('is-open'));
    layersPanel.hidden = true;
    layersButton.setAttribute('aria-expanded', 'false');
  };
  document.getElementById('peopleclose').onclick = function () { setPeopleOpen(false); };
  layersButton.onclick = function () {
    layersPanel.hidden = !layersPanel.hidden;
    layersButton.setAttribute('aria-expanded', String(!layersPanel.hidden));
  };
  setPeopleOpen(false);

  document.addEventListener('mousedown', function (e) {
    if (!layersPanel.hidden && !layersPanel.contains(e.target) && e.target !== layersButton) {
      layersPanel.hidden = true;
      layersButton.setAttribute('aria-expanded', 'false');
    }
  });

  function closeDetail() {
    detailPanel.hidden = true;
    detailPanel.innerHTML = '';
    delete detailPanel.dataset.id;
  }

  // Leaflet measures the container when the map is built, and this one is
  // sized by a CSS grid that may not have settled yet. Measured too early it
  // renders tiles for a viewport that no longer exists — a narrow strip of
  // map floating in a large empty box. Re-measuring costs nothing.
  function resize() { map.invalidateSize({ animate: false }); }
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  setTimeout(resize, 0);
  setTimeout(resize, 250);

  var people = new Map();   // id -> { data, marker, halo, path }

  // Who is looking. Null until /api/me answers; the share button and the
  // circle panel wait on it rather than guessing.
  var me = null;
  fetch('/api/me', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      me = d;
      if (!d) return;
      document.getElementById('circlebtn').hidden = !d.circles;
      // Only a person signed in as themselves has a session to end; the
      // shared token is ended by not using it.
      document.getElementById('signout').hidden = !d.id;
      if (d.circles) loadZones();
      // Anybody drawn before this answered was drawn as somebody else, you
      // included. Drawing the same fix again moves nothing; it repaints.
      if (d.id) { people.forEach(function (e) { if (e.data) draw(e.data); }); render(); }
    })
    .catch(function () {});

  // ------------------------------------------------------------- circle
  var panel = document.getElementById('circle');
  function nameOf(u) { return (u && (u.name || (u.username ? '@' + u.username : ''))) || 'someone'; }

  function drawCircle(c) {
    function rows(list, verb, path) {
      if (!list.length) return '';
      return list.map(function (u) {
        return '<div class="row"><span>' + esc(nameOf(u)) + '</span>'
          + '<button class="ghost" data-drop="' + esc(path + encodeURIComponent(u.id)) + '">' + verb + '</button></div>';
      }).join('');
    }
    panel.innerHTML =
      '<h2>Can see you</h2>'
      + (rows(c.canSeeMe, 'Remove', '/api/circle/viewer/') || '<p class="none">Nobody yet.</p>')
      + '<button class="ghost" id="mkinvite">Invite someone</button>'
      + '<div id="invitebox"></div>'
      + (me && me.live
        ? '<h2>Live links</h2><div id="livelist"><p class="none">…</p></div>'
          + '<p class="fine">Anyone holding one of these can follow you until it runs out: from when it was made, never inside your private places.</p>'
        : '')
      + '<h2>You can see</h2>'
      + (rows(c.iCanSee, 'Stop', '/api/circle/owner/') || '<p class="none">Nobody has invited you yet.</p>')
      + '<p class="fine">Seeing is one way: somebody seeing you does not let you see them.</p>'
      + '<h2>Private places</h2><div id="zonelist"><p class="none">…</p></div>'
      + '<button class="ghost" id="mkzone">Hide a place</button>'
      + '<p class="fine">Inside a private place your circle sees a soft blur, never the point, and paths you share leave it out. '
      + 'The blur is deliberately not centred on the spot you pick, so its middle does not point at your door. Admins still see everything.</p>'
      + '<h2>Watches</h2><div id="devices"><p class="none">…</p></div>'
      + '<button class="ghost" id="mkcode">Pair a watch</button><div id="codebox"></div>';
    loadDevices();
    fillZones();
    loadLive();
  }

  function loadLive() {
    if (!document.getElementById('livelist')) return;
    fetch('/api/live', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { fillLive((d && d.links) || []); })
      .catch(function () {});
  }

  function fillLive(links) {
    var box = document.getElementById('livelist');
    if (!box) return;
    box.innerHTML = links.length
      ? links.map(function (l) {
          return '<div class="row"><span>' + (l.reason === 'sos' ? 'SOS · ' : '') + 'until ' + esc(clock(l.expiresAt)) + '</span>'
            + '<span><button class="ghost" data-copylive="' + esc(l.path) + '">Copy</button> '
            + '<button class="ghost" data-unlive="' + esc(l.token) + '">Stop</button></span></div>';
        }).join('')
      : '<p class="none">None running. Make one from your own card, or with /live.</p>';
  }

  function loadDevices() {
    fetch('/api/devices', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var box = document.getElementById('devices');
        if (!box) return;
        box.innerHTML = d && d.devices.length
          ? d.devices.map(function (w) {
              return '<div class="row"><span>' + esc(w.name || w.platform || 'A watch') + '</span>'
                + '<button class="ghost" data-unpair="' + esc(w.id) + '">Remove</button></div>';
            }).join('')
          : '<p class="none">None paired.</p>';
      });
  }

  function openCircle() {
    fetch('/api/circle', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) { if (c) { drawCircle(c); panel.hidden = false; } });
  }

  document.getElementById('circlebtn').onclick = function () {
    if (!panel.hidden) { panel.hidden = true; return; }
    openCircle();
  };

  // A popover, so anything outside it closes it. It sits over the list of
  // people, and without this the list underneath could not be clicked until
  // somebody found the button that opened it.
  document.addEventListener('mousedown', function (e) {
    if (panel.hidden) return;
    if (panel.contains(e.target) || e.target.id === 'circlebtn') return;
    panel.hidden = true;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) panel.hidden = true;
  });

  panel.addEventListener('click', function (e) {
    var drop = e.target.closest && e.target.closest('[data-drop]');
    if (drop) {
      fetch(drop.getAttribute('data-drop'), { method: 'DELETE' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (c) { if (c) drawCircle(c); });
      return;
    }
    if (e.target.id === 'mkinvite') {
      e.target.disabled = true;
      fetch('/api/circle/invite', { method: 'POST' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var box = document.getElementById('invitebox');
          box.innerHTML = d && d.link
            ? '<div class="invite"><input readonly value="' + esc(d.link) + '" /><button class="ghost" id="copyinvite">Copy</button></div>'
              + '<p class="fine">Works once, for a day. Whoever opens it can see you until you remove them here or with /circle.</p>'
            : '<p class="none">' + esc((d && d.error) || 'Could not make an invite.') + '</p>';
        })
        .catch(function () {})
        .then(function () { e.target.disabled = false; });
      return;
    }
    var unlive = e.target.closest && e.target.closest('[data-unlive]');
    if (unlive) {
      fetch('/api/live/' + encodeURIComponent(unlive.getAttribute('data-unlive')), { method: 'DELETE' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d) fillLive(d.links); else loadLive(); });
      return;
    }
    var copylive = e.target.closest && e.target.closest('[data-copylive]');
    if (copylive) { copyText(location.origin + copylive.getAttribute('data-copylive'), copylive); return; }
    var unzone = e.target.closest && e.target.closest('[data-unzone]');
    if (unzone) {
      fetch('/api/zones/' + encodeURIComponent(unzone.getAttribute('data-unzone')), { method: 'DELETE' }).then(loadZones);
      return;
    }
    var showzone = e.target.closest && e.target.closest('[data-showzone]');
    if (showzone) {
      var z = myZones.filter(function (x) { return String(x.id) === showzone.getAttribute('data-showzone'); })[0];
      if (z) { panel.hidden = true; map.fitBounds(L.latLng(z.latitude, z.longitude).toBounds(z.radius * 2.6)); }
      return;
    }
    if (e.target.id === 'mkzone') {
      panel.hidden = true;
      arm('zone');
      return;
    }
    var unpair = e.target.closest && e.target.closest('[data-unpair]');
    if (unpair) {
      fetch('/api/devices/' + encodeURIComponent(unpair.getAttribute('data-unpair')), { method: 'DELETE' })
        .then(loadDevices);
      return;
    }
    if (e.target.id === 'mkcode') {
      fetch('/api/devices/code', { method: 'POST' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          document.getElementById('codebox').innerHTML = d
            ? '<div class="code">' + esc(d.code.slice(0, 3) + ' ' + d.code.slice(3)) + '</div>'
              + '<p class="fine">Type this into the livegeo app on your watch. It works once, for five minutes. The watch will see what you see, and report where it is as you.</p>'
            : '<p class="none">Pairing needs the database.</p>';
        });
      return;
    }
    if (e.target.id === 'copyinvite') {
      var input = panel.querySelector('.invite input');
      input.select();
      (navigator.clipboard ? navigator.clipboard.writeText(input.value) : Promise.reject())
        .then(function () { e.target.textContent = 'Copied'; })
        .catch(function () { document.execCommand && document.execCommand('copy'); });
    }
  });
  var fitted = false;

  function live(p) { return p.live || (p.liveUntil && p.liveUntil * 1000 > Date.now()); }

  // Whether this is whoever is looking. Nobody, until /api/me answers, and
  // for the shared token, which is nobody in particular.
  function mine(p) { return Boolean(me && me.id && me.id === String(p.id)); }

  function ago(at) {
    var s = Math.max(0, Math.round(Date.now() / 1000 - at));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    return Math.round(s / 3600) + 'h ago';
  }

  function left(p) {
    if (!p.liveUntil) return '';
    var s = Math.max(0, p.liveUntil - Math.round(Date.now() / 1000));
    if (s <= 0) return '';
    return s > 3600 ? Math.round(s / 3600) + 'h left' : Math.max(1, Math.round(s / 60)) + 'm left';
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // id -> { name, username, photo } once Telegram has been asked, or null
  // while the asking is in flight. The server caches too; this only keeps the
  // page from asking again on every mousemove.
  var identities = new Map();
  function identify(id) {
    if (identities.has(id)) return Promise.resolve(identities.get(id));
    identities.set(id, null);
    return fetch('/api/person/' + encodeURIComponent(id), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (who) { identities.set(id, who); return who; })
      .catch(function () { identities.set(id, null); return null; });
  }

  // What to call someone: their handle if Telegram told us, then whatever name
  // rode along on the message, and the bare id only as a last resort.
  function label(p) {
    var who = identities.get(p.id);
    if (who && who.username) return who.username;
    if (who && who.name) return who.name;
    return p.name || p.id;
  }

  // The hover on somebody's dot, as HTML — Leaflet puts a tooltip's text in
  // as markup, and a name is whatever its owner typed into Telegram.
  function tipOf(p) { return esc(label(p)) + (mine(p) ? ' (you)' : ''); }

  // Place names, cached by coordinates rounded to about eleven metres — a
  // person standing still asks once, not once per second.
  var places = new Map();
  function placeKey(lat, lon) { return lat.toFixed(4) + ',' + lon.toFixed(4); }
  function placeOf(lat, lon) {
    var key = placeKey(lat, lon);
    if (places.has(key)) return Promise.resolve(places.get(key));
    places.set(key, '');
    return fetch('/api/place?lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon),
                 { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { var v = (d && d.place) || ''; places.set(key, v); return v; })
      .catch(function () { return ''; });
  }

  // Where someone is, in words if PostGIS could say and in numbers if not.
  function whereabouts(p) {
    if (p.hidden) return 'somewhere private';
    if (p.latitude === null) return '—';
    var known = places.get(placeKey(p.latitude, p.longitude));
    return known || (p.latitude.toFixed(5) + ', ' + p.longitude.toFixed(5));
  }

  function card(p) {
    var who = identities.get(p.id);
    var title = (who && (who.name || who.username)) || p.name || '';
    var face = who && who.photo
      ? '<img src="/api/photo/' + encodeURIComponent(p.id) + '" alt="" />'
      : '<div class="noface">' + esc((title || '?').trim().charAt(0).toUpperCase() || '?') + '</div>';
    return '<div class="card">' + face + '<div>' +
      '<div class="cname">' + esc(title || p.id) + '</div>' +
      (who && who.username ? '<div class="chandle">' + esc(who.username) + '</div>' : '') +
      '<div class="cid">' + esc(p.id) + '</div>' +
      '<div class="chandle">' + esc(whereabouts(p)) + '</div>' +
      // Only on your own path, or for an admin. Seeing somebody is not their
      // consent to have their movements published; the server refuses it
      // too, and this only keeps the button from offering what will fail.
      ((p.trail || []).length > 1 && me && (me.admin || me.id === String(p.id))
        ? '<button class="ghost share" data-id="' + esc(p.id) + '">Share this path</button>'
        : '') +
      // An SOS: yours only, and what it does is said before anything is sent.
      (me && me.live && me.id === String(p.id)
        ? '<div class="sosline">' + sosLine(p) + '</div>'
        : '') +
      // Check on me: the same, for a stop that should not be happening.
      (me && me.checks && me.id === String(p.id)
        ? '<div class="sosline checkline">' + checkLine() + '</div>'
        : '') +
      // A link anyone can follow you on, for a while — the page it opens needs
      // no Telegram and no sign-in. Only for yourself: the server makes links
      // for nobody else, whoever asks.
      (me && me.live && me.id === String(p.id)
        ? '<div class="follow"><span class="chandle">Follow me for</span>'
          + [15, 60, 240].map(function (m) {
              return '<button class="ghost livebtn" data-min="' + m + '">' + (m < 60 ? m + ' min' : m / 60 + ' h') + '</button>';
            }).join('')
          + '</div>'
        : '') +
      // A day of your own path as a GPX file, for Strava, Garmin or your own
      // records. Yours or an admin's, as the server insists too.
      (me && (me.admin || me.id === String(p.id))
        ? '<div class="gpx"><span class="chandle">A day as GPX</span>'
          + '<input type="date" value="' + today() + '" max="' + today() + '" />'
          + '<button class="ghost gpxbtn" data-id="' + esc(p.id) + '">Download</button></div>'
        : '') +
      '</div></div>';
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // The chosen day, from midnight to midnight where the reader is, fetched and
  // then saved — so a day with nothing recorded says so on the button rather
  // than handing the browser a download that fails.
  function downloadDay(id, button) {
    var input = button.parentNode.querySelector('input[type=date]');
    var ymd = (input && input.value || '').split('-').map(Number);
    if (ymd.length !== 3 || !ymd[0]) return;
    var from = new Date(ymd[0], ymd[1] - 1, ymd[2]);
    var to = new Date(ymd[0], ymd[1] - 1, ymd[2] + 1);
    var url = '/api/gpx/' + encodeURIComponent(id) + '?from=' + Math.floor(from / 1000) + '&to=' + Math.floor(to / 1000)
      + '&tz=' + from.getTimezoneOffset();
    button.disabled = true;
    button.textContent = '…';
    fetch(url, { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) {
          return r.json().catch(function () { return {}; }).then(function (d) { throw new Error((d && d.error) || String(r.status)); });
        }
        var name = fileNameOf(r.headers.get('content-disposition')) || ('path-' + input.value + '.gpx');
        return r.blob().then(function (b) { save(b, name); button.textContent = 'Download'; });
      })
      .catch(function (e) {
        var why = e && e.message;
        button.textContent = why === 'nothing recorded then' ? 'nothing that day' : (why === 'no database' ? 'needs PostGIS' : 'could not export');
      })
      .then(function () { button.disabled = false; });
  }

  function fileNameOf(disposition) {
    var utf = /filename\*=UTF-8''([^;]+)/i.exec(disposition || '');
    if (utf) { try { return decodeURIComponent(utf[1]); } catch (e) { /* fall through to the plain one */ } }
    var plain = /filename="([^"]+)"/i.exec(disposition || '');
    return plain ? plain[1] : '';
  }

  function save(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
  }

  // A live link: whoever opens it follows you from now until it runs out.
  // Shown ready to copy, and to hand to the phone's own share sheet where
  // there is one — the way a ride is shared, to whatever app the other person
  // actually reads.
  function makeLive(minutes, button) {
    var box = button.parentNode;
    button.disabled = true;
    fetch('/api/live?minutes=' + minutes, { method: 'POST', credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d && res.d.error);
        var link = location.origin + res.d.path;
        box.outerHTML = '<div class="shared"><input readonly value="' + esc(link) + '" />'
          + '<span><button class="ghost copylink">Copy</button>'
          + (navigator.share ? ' <button class="ghost sendlink">Send…</button>' : '') + '</span>'
          + '<span class="meta">Anyone with this can follow you until ' + esc(clock(res.d.expiresAt))
          + ' — from now on, and never inside your private places. Stop it under Circle.</span></div>';
        var input = document.querySelector('.shared input');
        if (input) { input.focus(); input.select(); }
        loadLive();
      })
      .catch(function (e) {
        button.disabled = false;
        window.alert((e && e.message) || 'Could not make a live link.');
      });
  }

  function sosLine(p) {
    return p.sos
      ? '<span class="chandle">SOS on until ' + esc(clock(p.sos)) + ': everyone who can see you knows exactly where you are.</span>'
        + '<button class="ghost safebtn">I’m safe</button>'
      : '<button class="ghost sosbtn">SOS</button>';
  }

  // Asked twice, in effect: the button, then what it will do. An SOS is the
  // one thing here that deliberately sets private places aside.
  function raiseSos(button) {
    var ok = window.confirm('Send your exact location to everyone who can see you, and let them follow you for an hour — '
      + 'even inside your private places?\n\nThis calls nobody. If you are in danger, call the emergency services.');
    if (!ok) return;
    button.disabled = true;
    fetch('/api/sos', { method: 'POST', credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d && res.d.error);
        var d = res.d;
        button.parentNode.innerHTML = sosLine({ sos: d.until });
        window.alert((d.recent
          ? 'Already sent a moment ago — everybody who can see you has it.'
          : d.told
          ? 'Sent. ' + d.told + (d.told === 1 ? ' person who can see you knows' : ' people who can see you know') + ' where you are.'
          : 'Nobody could be told — nobody can see you yet. Send somebody this link: ' + location.origin + d.path)
          + '\n\nThis called nobody. If you are in danger, call ' + d.call + '.');
      })
      .catch(function (e) {
        button.disabled = false;
        window.alert(((e && e.message) || 'Could not send the SOS.') + ' If you are in danger, call the emergency services.');
      });
  }

  function endSos(button) {
    button.disabled = true;
    fetch('/api/sos', { method: 'DELETE', credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function () { button.parentNode.innerHTML = sosLine({}); loadLive(); })
      .catch(function () { button.disabled = false; });
  }

  function checkLine() {
    return me && me.check && me.check * 1000 > Date.now()
      ? '<span class="chandle">Checking on you until ' + esc(clock(me.check)) + '.</span><button class="ghost uncheckbtn">Stop</button>'
      : '<button class="ghost checkbtn">Check on me for 2 h</button>';
  }

  function startCheck(button) {
    var ok = window.confirm('For the next two hours: if you stop for ' + ((me && me.checkStop) || 15) + ' minutes somewhere that is not one of your places, '
      + 'or your live location stops, the bot asks whether you are all right. If you do not answer within 5 minutes, '
      + 'everyone who can see you is told where you are.');
    if (!ok) return;
    button.disabled = true;
    fetch('/api/check?hours=2', { method: 'POST', credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d && res.d.error);
        me.check = res.d.until;
        button.parentNode.innerHTML = checkLine();
      })
      .catch(function (e) { button.disabled = false; window.alert((e && e.message) || 'Could not start checking on you.'); });
  }

  function stopCheck(button) {
    button.disabled = true;
    fetch('/api/check', { method: 'DELETE', credentials: 'same-origin' })
      .then(function () { me.check = null; button.parentNode.innerHTML = checkLine(); })
      .catch(function () { button.disabled = false; });
  }

  function copyText(text, button) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { button.textContent = 'Copied'; })
      .catch(function () { window.prompt('Copy this link:', text); });
  }

  // Opening the card is what pulls the photo — hovering should stay cheap.
  // Handing a path to somebody without the dashboard. The link is a frozen
  // copy, not a window that keeps following them, and it expires.
  function share(id, button) {
    button.disabled = true;
    button.textContent = 'sharing…';
    fetch('/api/share/' + encodeURIComponent(id), { method: 'POST', credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d && res.d.error);
        var link = location.origin + res.d.path;
        var days = Math.round(res.d.expiresIn / 86400);
        button.outerHTML =
          '<div class="shared"><input readonly value="' + esc(link) + '" />' +
          '<span class="meta">expires in ' + days + ' day' + (days === 1 ? '' : 's') + '</span></div>';
        var input = document.querySelector('.shared input');
        if (input) { input.focus(); input.select(); }
      })
      .catch(function (e) {
        button.disabled = false;
        button.textContent = (e && e.message) === 'no database' ? 'needs PostGIS' : 'could not share';
      });
  }

  function openCard(p, marker) {
    function paint() {
      if (detailPanel.dataset.id !== String(p.id)) return;
      detailPanel.innerHTML =
        '<div class="detail-head"><span>Location details</span>'
        + '<button class="panel-close" id="detailclose" type="button" aria-label="Close details">×</button></div>'
        + card(p);
      document.getElementById('detailclose').onclick = closeDetail;
    }
    detailPanel.dataset.id = String(p.id);
    detailPanel.hidden = false;
    paint();
    identify(p.id).then(function () { paint(); });
    if (window.matchMedia && window.matchMedia('(max-width:760px)').matches) setPeopleOpen(false);
  }

  // Which path is being looked at. `lit` is pinned by a click or a tap and
  // stays; `hovered` is transient and only exists on a device with a pointer.
  var lit = null;
  var hovered = null;
  // Separate from `hovered` because a marker and its path are hovered by
  // different things, and one leaving must not unlight the other.
  var pathHover = null;

  function shine() {
    var id = lit || hovered || pathHover;
    document.body.classList.toggle('spotlight', Boolean(id));
    // The row follows the map. It used to be marked only when the list was
    // rebuilt, so lighting somebody by hovering dimmed their own row with
    // everyone else's.
    document.querySelectorAll('#list .person').forEach(function (row) {
      row.classList.toggle('lit', Boolean(id) && row.dataset.id === String(id));
    });

    people.forEach(function (e, key) {
      if (!e.data) return;
      var focus = Boolean(id) && key === id;
      var dim = Boolean(id) && !focus;

      if (e.marker) {
        e.marker.setStyle({ opacity: dim ? .2 : 1, fillOpacity: dim ? .25 : 1 });
        e.marker.setRadius(focus ? 9 : 7);
      }
      if (e.halo) e.halo.setStyle({ opacity: dim ? .05 : .3, fillOpacity: dim ? .01 : .06 });
      if (e.beam) e.beam.setOpacity(dim ? .15 : 1);
      var veilEl = e.veil && e.veil.getElement();
      if (veilEl) veilEl.classList.toggle('dim', dim);
      var chipEl = e.chip && e.chip.getElement();
      if (chipEl) { chipEl.classList.toggle('dim', dim); chipEl.classList.toggle('lit', focus); }
      if (e.fades) e.fades.eachLayer(function (m) { m.setOpacity(dim ? .15 : 1); });
      if (e.path) {
        e.path.setStyle({
          opacity: focus ? 1 : (dim ? .08 : .45),
          weight: focus ? 4 : 2,
          // Solid when lit: a dashed line reads as provisional, and this is
          // the one thing being asserted.
          dashArray: focus ? null : (mine(e.data) ? null : '4 5'),
          color: focus ? colourOf(e.data) : trailColourOf(e.data),
        });
      }

      // A wider, softer line underneath is what makes it look lit rather than
      // merely thicker.
      if (layerPrefs.trails && focus && e.path) {
        var pts = e.path.getLatLngs();
        if (!e.glow) {
          e.glow = L.polyline(pts, {
            weight: 14, opacity: .2, lineCap: 'round', lineJoin: 'round',
            color: e.path.options.color,
          }).addTo(map);
        }
        e.glow.setLatLngs(pts).setStyle({ color: e.path.options.color });
        e.glow.bringToBack();
      } else if (e.glow) {
        map.removeLayer(e.glow);
        e.glow = null;
      }
    });
  }

  function pin(id) {
    lit = (lit === id) ? null : id;
    if (lit) loadHistory(lit);
    shine();
  }

  // ------------------------------------------------ what time it was there
  //
  // The live trail is the last TRAIL_MAX fixes, which on a busy day is the
  // last hour. Lighting a person asks for their last day from history, which
  // is recorded and until now was never drawn.
  var historyAsked = {};
  function loadHistory(id) {
    if (historyAsked[id]) return;
    historyAsked[id] = true;
    var since = Math.floor(Date.now() / 1000) - 86400;
    fetch('/api/history/' + encodeURIComponent(id) + '?since=' + since, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var e = people.get(id);
        if (!d || !d.points || !d.points.length || !e || !e.data) return;
        e.history = d.points;
        draw(e.data);
        shine();
      })
      .catch(function () { historyAsked[id] = false; });
  }

  // How far from a line a pointer can be and still mean it. A thin dashed
  // line is hard to land on exactly, and a finger is wider than a cursor.
  var REACH = 12;

  // The nearest drawn path to a point on screen, if any is close enough.
  // Only the lit one while something is pinned, so moving across the map
  // does not flick between people.
  function pathHit(pt) {
    if (!layerPrefs.trails) return null;
    var best = null;
    var ids = lit ? [lit] : Array.from(people.keys());
    ids.forEach(function (id) {
      var e = people.get(id);
      if (!e || !e.path || !e.pts || e.pts.length < 2) return;
      var px = e.pts.map(function (q) {
        var pt = map.latLngToContainerPoint([q.latitude, q.longitude]);
        if (q.gap) pt.gap = true;
        return pt;
      });
      var hit = PathTime.nearestSegment(px, pt);
      if (hit && hit.distance <= REACH && (!best || hit.distance < best.hit.distance)) {
        best = { id: id, e: e, hit: hit, px: px };
      }
    });
    return best;
  }

  function clock(at) {
    var d = new Date(at * 1000);
    var hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    // Yesterday's 14:32 is not today's; history reaches back a day.
    return d.toDateString() === new Date().toDateString()
      ? hm
      : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + hm;
  }

  var timeTip = L.tooltip({ direction: 'top', offset: [0, -8], className: 'time-tip', opacity: 1 });

  function showTime(found) {
    var e = found.e;
    var h = found.hit;
    var a = e.pts[h.index];
    var b = e.pts[h.index + 1];
    var at = PathTime.timeAt(e.pts.map(function (q) { return q.at; }), h.index, h.t);
    if (at === null) { hideTime(); return; }

    // Exact at a fix, estimated between two. Within a few pixels of a fix
    // the reader is pointing at it, and it would be odd to call that a guess.
    var len = found.px[h.index].distanceTo(found.px[h.index + 1]);
    var exact = Math.min(h.t, 1 - h.t) * len < 6;
    var speed = PathTime.speedLabel(PathTime.speedBetween(a, b));

    var where = L.latLng(
      a.latitude + (b.latitude - a.latitude) * h.t,
      a.longitude + (b.longitude - a.longitude) * h.t
    );
    timeTip.setLatLng(where).setContent(
      (exact ? '' : '≈ ') + esc(clock(at))
      + ' <span class="quiet">· ' + esc(ago(at)) + (speed ? ' · ' + esc(speed) : '') + '</span>'
    );
    if (!map.hasLayer(timeTip)) timeTip.addTo(map);
  }

  function hideTime() { if (map.hasLayer(timeTip)) map.removeLayer(timeTip); }

  // Coalesced to one check per frame: projecting every fix on every mousemove
  // is cheap for a handful of people, but not free.
  var frame = 0;
  var pointer = null;
  map.on('mousemove', function (ev) {
    pointer = ev.containerPoint;
    if (frame) return;
    frame = requestAnimationFrame(function () {
      frame = 0;
      if (arming || !pointer) return;
      var found = pathHit(pointer);
      var want = found ? found.id : null;
      if (!lit && want !== pathHover) { pathHover = want; shine(); }
      if (found) showTime(found); else hideTime();
    });
  });
  map.on('mouseout', function () {
    pointer = null;
    hideTime();
    if (pathHover) { pathHover = null; shine(); }
  });

  // A tap on a path is how a touch screen asks the same question, since it
  // has no hover. A tap anywhere else puts everything back.
  map.on('click', function (ev) {
    if (arming) return;
    var found = pathHit(ev.containerPoint);
    if (found) {
      if (lit !== found.id) { lit = found.id; loadHistory(lit); shine(); }
      showTime(found);
      return;
    }
    lit = null; hovered = null; pathHover = null;
    hideTime();
    closeDetail();
    shine();
  });

  // Delegated: the card's markup is replaced when the identity lookup lands,
  // so a handler bound to the button would not survive it.
  document.addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('button.gpxbtn');
    if (g) { e.preventDefault(); downloadDay(g.getAttribute('data-id'), g); return; }
    var lv = e.target.closest && e.target.closest('button.livebtn');
    if (lv) { e.preventDefault(); makeLive(Number(lv.getAttribute('data-min')), lv); return; }
    var sb = e.target.closest && e.target.closest('button.sosbtn, button.safebtn');
    if (sb) { e.preventDefault(); if (sb.classList.contains('sosbtn')) raiseSos(sb); else endSos(sb); return; }
    var cb = e.target.closest && e.target.closest('button.checkbtn, button.uncheckbtn');
    if (cb) { e.preventDefault(); if (cb.classList.contains('checkbtn')) startCheck(cb); else stopCheck(cb); return; }
    var cp = e.target.closest && e.target.closest('button.copylink, button.sendlink');
    if (cp) {
      e.preventDefault();
      var input = cp.closest('.shared').querySelector('input');
      if (cp.classList.contains('sendlink')) navigator.share({ url: input.value, title: 'Follow me' }).catch(function () {});
      else copyText(input.value, cp);
      return;
    }
    var b = e.target.closest && e.target.closest('button.share');
    if (!b) return;
    e.preventDefault();
    share(b.getAttribute('data-id'), b);
  });

  // Hover, click and card for whatever stands for somebody on the map: their
  // dot, or the name on their blur. Wired per layer, because going into a
  // private place swaps one for the other.
  function wire(layer, entry) {
    var id = entry.data.id;
    layer.on('mouseover', function () {
      hovered = id;
      shine();
      // Hovering resolves the id to a handle; the label is rewritten once the
      // answer lands, so the first hover shows the number only briefly.
      identify(id).then(function () { relabel(entry); });
    });
    layer.on('mouseout', function () { hovered = null; shine(); });
    layer.on('click', function (e) {
      // Without this the map's own click handler fires too and immediately
      // unpins what was just pinned.
      L.DomEvent.stopPropagation(e);
      pin(id);
      openCard(entry.data, layer);
    });
  }

  function chipIcon(p) {
    return L.divIcon({ className: 'veil-chip', html: '<span>' + esc(label(p)) + '</span>', iconSize: [0, 0] });
  }

  // In place rather than by replacing the icon: a new element under the
  // pointer would count as a new hover, which would relabel it again.
  function relabel(entry) {
    if (entry.marker) entry.marker.setTooltipContent(tipOf(entry.data));
    var span = entry.chip && entry.chip.getElement() && entry.chip.getElement().querySelector('span');
    if (span) span.textContent = label(entry.data);
  }

  // Hex, always: people-map.js mixes these into rgba() for blurs and beams.
  function cssVar(name, fallback) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }

  // An SOS is red whoever it is. Otherwise you are blue, so you can find
  // yourself among everyone else, and the rest are green while they share.
  function colourOf(p) {
    if (p.sos) return cssVar('--danger', '#ff5a62');
    if (mine(p)) return live(p) ? cssVar('--me', '#4cb5ff') : cssVar('--me-stale', '#7499b4');
    return live(p) ? cssVar('--live', '#40e38f') : '#78868c';
  }

  function trailColourOf(p) {
    if (p.sos) return cssVar('--danger', '#ff5a62');
    if (mine(p)) return cssVar('--me', '#4cb5ff');
    return live(p) ? '#78958c' : '#5f7077';
  }

  function draw(p) {
    if (p.latitude === null || p.longitude === null) return;
    var here = [p.latitude, p.longitude];
    var entry = people.get(p.id) || {};
    var before = entry.data;
    entry.data = p;
    people.set(p.id, entry);

    var colour = colourOf(p);

    if (p.hidden) {
      // Inside a private place: what arrived is the place, not a point. The
      // dot, if there was one, dissolves into the blur that now stands for
      // them, and their name sits on it for hovering and clicking.
      if (entry.marker) {
        drawing.halt(entry);
        drawing.puff(entry.marker.getLatLng(), colour, 'dissolve');
        map.removeLayer(entry.marker);
        entry.marker = null;
      }
      if (entry.halo) { map.removeLayer(entry.halo); entry.halo = null; }
      var area = L.latLng(here).toBounds(Math.max(50, p.accuracy || 0) * 2);
      if (!entry.veil) entry.veil = drawing.veil(area, 'in').addTo(map);
      else entry.veil.setBounds(area);
      drawing.tint(entry.veil, colour);
      drawing.size();
      if (!entry.chip) {
        entry.chip = L.marker(here, { icon: chipIcon(p), keyboard: false }).addTo(map);
        wire(entry.chip, entry);
      } else {
        entry.chip.setLatLng(here);
        relabel(entry);
      }
    } else {
      // In the open. Coming out of a private place, the blur swells away and
      // the dot condenses where they now are.
      if (entry.veil) {
        drawing.fadeOut(entry.veil);
        entry.veil = null;
        drawing.puff(L.latLng(here), colour, 'condense');
      }
      if (entry.chip) { map.removeLayer(entry.chip); entry.chip = null; }
      var fresh = !entry.marker;
      if (fresh) {
        entry.marker = L.circleMarker(here, { radius: 6.5, weight: 2, color: '#071318', fillColor: colour, fillOpacity: 1 }).addTo(map);
        entry.marker.bindTooltip(tipOf(p), { permanent: false });
        wire(entry.marker, entry);
      }
      entry.marker.setStyle({ color: '#071318', fillColor: colour });
      relabel(entry);
      if (p.accuracy) {
        if (!entry.halo) entry.halo = L.circle(entry.marker.getLatLng(), { weight: 1, opacity: .3, fillOpacity: .06, color: colour, interactive: false }).addTo(map);
        entry.halo.setRadius(p.accuracy).setStyle({ color: colour });
      }
      // From wherever the dot is drawn — mid-glide, if another fix is still
      // arriving — to where they are now, at about the pace the fixes came.
      var from = entry.marker.getLatLng();
      drawing.glide(entry, L.latLng(here), fresh || !before ? 0
        : PathTime.glideFor({ latitude: from.lat, longitude: from.lng }, p, p.at - before.at));
    }

    // Every fix keeps its time beside it; the hover asks for it by index.
    // Where a stretch was hidden the path breaks, drawn as separate runs, and
    // each end fades out instead of stopping dead.
    entry.pts = PathTime.merge(entry.history, p.trail);
    aimAt(entry);
    var runs = PathTime.runs(entry.pts);
    var lines = runs.filter(function (r) { return r.length > 1; })
      .map(function (r) { return r.map(function (t) { return [t.latitude, t.longitude]; }); });
    if (lines.length) {
      var trailColour = trailColourOf(p);
      if (!entry.path) {
        entry.path = L.polyline(lines, { weight: mine(p) ? 2.6 : 1.8, opacity: mine(p) ? .72 : .34, dashArray: mine(p) ? null : '4 5', color: trailColour });
        if (layerPrefs.trails) entry.path.addTo(map);
      } else {
        entry.path.setLatLngs(lines).setStyle({ color: trailColour });
      }
      if (entry.glow) entry.glow.setLatLngs(lines);
    }
    fadeEnds(entry, runs, colour, p.hidden);

    // Yours on top: standing where somebody else is — at home, together —
    // must not put you under their dot, however late theirs was drawn.
    people.forEach(function (e) { if (e.marker && mine(e.data)) e.marker.bringToFront(); });

    // Fit once, to everyone. After that the map stays where it was put: a
    // view that jumps to whoever moved last is unusable the moment two people
    // are sharing, so recentring is a button rather than a surprise.
    if (!fitted) { fit(); fitted = true; }

    // The one exception: somebody just asked for help. Whoever is watching is
    // taken to them, once — not on every fix after, and not the person who
    // pressed it, who knows where they are.
    if (p.sos && !(before && before.sos) && !(me && me.id === String(p.id))) {
      map.setView(here, Math.max(map.getZoom(), 15));
    }
  }

  // The beam, pointed the way somebody is going, or taken away once they are
  // not going anywhere. Asked again every few seconds as well as on every
  // fix: stopping sends no update to say so, and a beam left behind would
  // keep asserting a direction nobody is travelling in.
  function aimAt(entry) {
    var p = entry.data;
    if (!p) return;
    var deg = p.hidden ? null : PathTime.headingOf(p.heading, entry.pts, Date.now() / 1000);
    drawing.aim(entry, deg, colourOf(p));
    var id = lit || hovered || pathHover;
    if (entry.beam) entry.beam.setOpacity(id && id !== p.id ? .15 : 1);
  }

  // A soft spot where a path goes out of view into a private place, and
  // where it comes back out.
  function fadeEnds(entry, runs, colour, hidden) {
    if (!entry.fades) {
      entry.fades = L.layerGroup();
      if (layerPrefs.trails) entry.fades.addTo(map);
    }
    entry.fades.clearLayers();
    var at = function (q) {
      L.marker([q.latitude, q.longitude], {
        icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11],
          html: '<div class="fade-end" style="background:radial-gradient(closest-side,' + colour + ',transparent)"></div>' }),
        interactive: false, keyboard: false,
      }).addTo(entry.fades);
    };
    runs.forEach(function (run, k) {
      if (k > 0) at(run[0]);
      if (k < runs.length - 1 || hidden) at(run[run.length - 1]);
    });
  }

  function fit() {
    var pts = [];
    people.forEach(function (e) {
      if (e.data && e.data.latitude !== null) pts.push([e.data.latitude, e.data.longitude]);
    });
    if (!pts.length) return;
    if (pts.length === 1) map.setView(pts[0], 15);
    else map.fitBounds(L.latLngBounds(pts).pad(0.25));
  }

  // A row's name: the dot, who it is, and on your own row that it is you —
  // in words as well as in blue.
  function whoHtml(p) { return '<i></i>' + esc(label(p)) + (mine(p) ? '<span class="you">you</span>' : ''); }

  function render() {
    var list = document.getElementById('list');
    var rows = Array.from(people.values()).map(function (e) { return e.data; })
      .sort(function (a, b) { return b.at - a.at; });

    var countText = rows.length ? rows.length + (rows.length === 1 ? ' person' : ' people') : '';
    document.getElementById('count').textContent = countText;
    document.getElementById('panelcount').textContent = countText;
    document.getElementById('peoplebadge').textContent = rows.length ? String(rows.length) : '';
    document.getElementById('recentre').hidden = !rows.length;

    if (lit && !people.has(lit)) { lit = null; shine(); }
    if (hovered && !people.has(hovered)) { hovered = null; shine(); }

    if (!rows.length) { list.innerHTML = '<p class="empty">Nobody is sharing a location yet.</p>'; return; }

    list.innerHTML = '';
    rows.forEach(function (p) {
      var el = document.createElement('button');
      el.className = 'person' + (live(p) ? ' live' : '') + (p.sos ? ' sos' : '') + (mine(p) ? ' me' : '')
        + ((lit || hovered || pathHover) === p.id ? ' lit' : '');
      el.dataset.id = p.id;
      el.innerHTML =
        '<span class="who">' + whoHtml(p) + '</span>' +
        (p.sos ? '<span class="meta alarm">🆘 asked for help · until ' + esc(clock(p.sos)) + '</span>' : '') +
        '<span class="meta">' +
          (p.stopped ? 'stopped · ' : '') +
          (live(p) ? 'live · ' + left(p) + ' · ' : '') + ago(p.at) +
        '</span>' +
        '<span class="meta">' + esc(whereabouts(p)) + '</span>';

      // Kicks off the lookup; the next render picks up the answer.
      if (p.latitude !== null && !p.hidden) placeOf(p.latitude, p.longitude);
      // Rows resolve lazily too, so a list of numbers fills in with handles.
      identify(p.id).then(function (who) {
        if (who && (who.username || who.name)) {
          var who_el = el.querySelector('.who');
          if (who_el) who_el.innerHTML = whoHtml(p);
        }
      });
      // The list is the other way in: hovering a row lights the same path the
      // marker does, and on a touch screen tapping one is the only way in.
      el.onmouseenter = function () { hovered = p.id; shine(); };
      el.onmouseleave = function () { hovered = null; shine(); };
      el.onclick = function () {
        pin(p.id);
        if (p.latitude === null) return;
        var entry = people.get(p.id);
        // Fit the whole path when lighting one, rather than zooming to the
        // last point — the point of lighting it is to see where it went.
        if (lit === p.id && entry && entry.path && (entry.pts || []).length > 1) {
          var span = L.latLngBounds(entry.path.getBounds().getSouthWest(), entry.path.getBounds().getNorthEast());
          if (entry.veil) span.extend(entry.veil.getBounds());
          map.fitBounds(span.pad(0.25));
        } else if (entry && entry.veil) {
          map.fitBounds(entry.veil.getBounds().pad(0.3));
        } else {
          map.setView([p.latitude, p.longitude], 16);
        }
        if (entry && (entry.marker || entry.chip)) openCard(p, entry.marker || entry.chip);
      };
      list.appendChild(el);
    });
  }

  function apply(p) { draw(p); render(); }

  var conn = document.getElementById('conn');
  function status(up, text) {
    conn.className = 'conn' + (up ? ' up' : '');
    conn.lastElementChild.textContent = text;
  }

  // ------------------------------------------------------------- fences
  //
  // Drawn as the polygon PostGIS actually stores rather than as a circle, so
  // what is on screen is what the boundary test uses. ST_Buffer makes a
  // thirty-two sided ring, which at any useful zoom is a circle.
  var fenceLayer = L.layerGroup().addTo(map);
  // What a click on the map is about to make: false, 'fence' or 'zone'.
  var arming = false;

  function drawFences(list) {
    fenceLayer.clearLayers();
    (list || []).forEach(function (f) {
      if (!f.ring || f.ring.length < 3) return;
      var shape = L.polygon(f.ring, {
        color: '#7a6ff0', weight: 1.5, opacity: .7,
        fillColor: '#7a6ff0', fillOpacity: .07, interactive: true
      }).addTo(fenceLayer);
      // Above the centre rather than on it: a fence usually has somebody
      // standing in the middle of it, and the label was landing under them.
      shape.bindTooltip(esc(f.name), { permanent: true, direction: 'top', className: 'fence-label' });
      // Under the paths, always: fences are redrawn whenever one changes, and
      // redrawn last they would otherwise sit on top of everything.
      shape.bringToBack();
      shape.on('click', function (e) {
        // Only swallow the click when it means something here. Stopping it
        // unconditionally made the inside of an existing fence a dead zone:
        // the map never saw the click, so a new fence could not overlap an
        // old one.
        if (arming) return;
        // A tap near a path inside a fence is a question about the path, and
        // letting it bubble means the map's handler answers it. Otherwise
        // asking the time of anywhere near home offered to delete home.
        if (pathHit(e.containerPoint)) return;
        L.DomEvent.stopPropagation(e);
        if (!window.confirm('Remove the fence “' + f.name + '”?')) return;
        fetch('/api/fences/' + encodeURIComponent(f.id), { method: 'DELETE' })
          .then(loadFences)
          .catch(function () { /* the list redraws on the next change anyway */ });
      });
    });
  }

  function loadFences() {
    return fetch('/api/fences', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        // 503 means no PostGIS, which is an ordinary state: fences are a
        // capability, like place names. The button simply stays hidden.
        if (!d) return;
        document.getElementById('newfence').hidden = false;
        drawFences(d.fences);
      })
      .catch(function () {});
  }

  function arm(kind) {
    arming = kind || false;
    document.body.classList.toggle('fencing', Boolean(arming));
    document.getElementById('newfence').textContent = arming === 'fence' ? 'Click the map…' : 'New fence';
    var hint = document.getElementById('hint');
    hint.hidden = arming !== 'zone';
    hint.textContent = arming === 'zone' ? 'Click the place to hide — Esc to stop' : '';
  }

  document.getElementById('newfence').onclick = function () { arm(arming === 'fence' ? false : 'fence'); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && arming) arm(false); });

  map.on('click', function (e) {
    if (!arming) return;
    var kind = arming;
    arm(false);
    if (kind === 'zone') { hidePlace(e.latlng); return; }
    var name = window.prompt('What is this place called?');
    if (!name) return;
    var radius = Number(window.prompt('How far across, in metres?', '150'));
    if (!radius || radius < 25 || radius > 50000) {
      window.alert('A fence needs a radius between 25 m and 50 km.');
      return;
    }
    var q = '?name=' + encodeURIComponent(name)
      + '&lat=' + e.latlng.lat + '&lon=' + e.latlng.lng + '&radius=' + radius;
    fetch('/api/fences' + q, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.error) window.alert(d.error); return loadFences(); })
      .catch(function () { window.alert('Could not save that fence.'); });
  });

  // ------------------------------------------------------ private places
  //
  // Your own, and only yours: the server never says where anybody else's
  // are. Drawn for you as the same blur your circle sees, lighter and still,
  // with its edge marked, so you know where they stop seeing you.
  var myZones = [];
  var zoneLayer = L.layerGroup().addTo(map);

  function syncTrails() {
    people.forEach(function (e) {
      ['path', 'glow', 'fades'].forEach(function (key) {
        var layer = e[key];
        if (!layer) return;
        if (layerPrefs.trails) {
          if (!map.hasLayer(layer)) layer.addTo(map);
        } else if (map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });
    });
    if (!layerPrefs.trails) hideTime();
  }

  function applyLayerPreference(name, on) {
    layerPrefs[name] = on;
    var layer = name === 'raster' ? rasterBase
      : name === 'cartography' ? cartography
      : name === 'fences' ? fenceLayer
      : name === 'zones' ? zoneLayer
      : null;
    if (layer) {
      if (on && !map.hasLayer(layer)) layer.addTo(map);
      if (!on && map.hasLayer(layer)) map.removeLayer(layer);
    }
    if (name === 'trails') syncTrails();
  }

  layersPanel.addEventListener('change', function (e) {
    var box = e.target.closest && e.target.closest('input[data-layer]');
    if (!box) return;
    applyLayerPreference(box.getAttribute('data-layer'), box.checked);
  });

  function loadZones() {
    return fetch('/api/zones', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        myZones = (d && d.zones) || [];
        fillZones();
        drawOwnZones();
      })
      .catch(function () {});
  }

  function fillZones() {
    var box = document.getElementById('zonelist');
    if (!box) return;
    box.innerHTML = myZones.length
      ? myZones.map(function (z) {
          var size = z.radius >= 1000 ? (z.radius / 1000).toFixed(1).replace(/\.0$/, '') + ' km' : Math.round(z.radius) + ' m';
          return '<div class="row"><span>' + esc(z.name || 'A private place') + ' · ' + esc(size) + '</span>'
            + '<span><button class="ghost" data-showzone="' + esc(z.id) + '">Show</button> '
            + '<button class="ghost" data-unzone="' + esc(z.id) + '">Remove</button></span></div>';
        }).join('')
      : '<p class="none">None yet.</p>';
  }

  function drawOwnZones() {
    zoneLayer.clearLayers();
    myZones.forEach(function (z) {
      var area = L.latLng(z.latitude, z.longitude).toBounds(z.radius * 2);
      var v = drawing.veil(area, 'mine');
      zoneLayer.addLayer(v);
      drawing.tint(v, '#7a6ff0');
      drawing.size();
      // On the rim rather than in the middle, which is where you are.
      L.tooltip({ permanent: true, direction: 'top', className: 'fence-label' })
        .setLatLng([area.getNorth(), z.longitude])
        .setContent('Private · ' + esc(z.name || ''))
        .addTo(zoneLayer);
    });
  }

  function hidePlace(latlng) {
    var name = window.prompt('What is this place? Only you will see the name.', 'Home');
    if (name === null) return;
    var radius = Number(window.prompt('How far around it should be hidden, in metres? (200 to 5000)', '500'));
    if (!radius || radius < 200 || radius > 5000) {
      window.alert('A private place needs a radius between 200 m and 5 km.');
      return;
    }
    fetch('/api/zones?name=' + encodeURIComponent(name) + '&lat=' + latlng.lat + '&lon=' + latlng.lng + '&radius=' + radius,
      { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.error) window.alert(d.error); return loadZones(); })
      .catch(function () { window.alert('Could not save that place.'); });
  }

  function drop(id) {
    var entry = people.get(id);
    if (!entry) return false;
    drawing.halt(entry);
    ['marker', 'halo', 'beam', 'path', 'glow', 'veil', 'chip', 'fades'].forEach(function (k) { if (entry[k]) map.removeLayer(entry[k]); });
    people.delete(id);
    // What was fetched of their history goes too. A person sent again after
    // being forgotten — because they hid a place, say — is asked for afresh,
    // and gets only what they may be shown now.
    delete historyAsked[id];
    return true;
  }

  // Asking, rather than being told. This is the fallback, not the plan: it
  // cannot show a change sooner than the next ask, and it re-sends everyone
  // each time.
  var polling = null;
  var attempt = null;

  function stopPolling() {
    if (!polling) return;
    clearInterval(polling.ask);
    clearInterval(polling.retry);
    polling = null;
  }

  function ask() {
    fetch('/api/positions', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { status(false, 'offline'); return; }
        if (polling) status(true, 'polling');
        var seen = {};
        d.people.forEach(function (p) { seen[p.id] = true; draw(p); });
        // Nothing announces a departure here, so it has to be noticed: anyone
        // the server no longer lists has gone.
        Array.from(people.keys()).forEach(function (id) { if (!seen[id]) drop(id); });
        render();
      })
      .catch(function () { status(false, 'offline'); });
  }

  function poll() {
    if (polling) return;
    status(true, 'polling');
    // Falling back is not a verdict. Whatever was holding the stream may be
    // taken out of the path — a tunnel swapped for a Worker, a proxy
    // reconfigured — and a page that never looked again would stay slow for
    // as long as it stayed open. That is what «stuck in polling» was.
    polling = { ask: setInterval(ask, 5000), retry: setInterval(stream, 60000) };
    ask();
  }

  function event(chunk) {
    var name = '', data = '';
    chunk.split('\n').forEach(function (line) {
      if (line.slice(0, 6) === 'event:') name = line.slice(6).trim();
      else if (line.slice(0, 5) === 'data:') data += line.slice(5).trim();
    });
    if (!name) return;
    // Anything at all means the stream is delivering, heartbeats included.
    stopPolling();
    status(true, 'live');
    if (name === 'beat') return;
    var d = data ? JSON.parse(data) : {};
    if (name === 'hello') { d.people.forEach(apply); render(); }
    else if (name === 'position') apply(d);
    else if (name === 'forget') { if (drop(d.id)) render(); }
    // Your own private places changed, here or in another tab.
    else if (name === 'zones') loadZones();
    // Either a fence was added or removed, or somebody crossed one. Both mean
    // the drawn set may be stale, and redrawing is one small request.
    else if (name === 'fence') loadFences();
  }

  // Read by hand over POST rather than with EventSource, for one reason:
  // cloudflared holds a server-sent stream on a GET until the connection
  // closes, and delivers the same stream over POST as it arrives
  // (cloudflare/cloudflared#1449). EventSource can only ever issue a GET, so
  // behind a tunnel it is buffered whatever the server does. The cost is
  // reconnection and parsing, which EventSource used to do for us and which
  // is the rest of this function.
  function stream() {
    if (attempt) attempt.abort();
    var ctl = new AbortController();
    attempt = ctl;
    var last = 0;
    var started = Date.now();

    // Two windows, because they are different failures wearing the same face:
    // eight seconds to say hello at all, then seventy of silence on a stream
    // that did — long enough for two missed heartbeats. Without the second, a
    // stream that quietly stopped delivering read as «live» above a map that
    // was no longer being updated, which is the worst of the three states.
    var watch = setInterval(function () {
      if (attempt !== ctl) { clearInterval(watch); return; }
      if (Date.now() - (last || started) > (last ? 70000 : 8000)) {
        clearInterval(watch);
        ctl.abort();
        poll();
      }
    }, 2000);

    fetch('/api/stream', { method: 'POST', cache: 'no-store', signal: ctl.signal })
      .then(function (r) {
        if (!r.ok || !r.body) throw new Error('no stream');
        var reader = r.body.getReader();
        var dec = new TextDecoder();
        var buf = '';
        return (function pump() {
          return reader.read().then(function (step) {
            if (step.done) throw new Error('ended');
            last = Date.now();
            buf += dec.decode(step.value, { stream: true });
            // A blank line ends an event; whatever follows the last one is the
            // beginning of the next and waits for the rest of itself.
            var parts = buf.split('\n\n');
            buf = parts.pop();
            parts.forEach(event);
            return pump();
          });
        })();
      })
      .catch(function () {
        clearInterval(watch);
        if (attempt !== ctl) return;     // a newer attempt has taken over
        attempt = null;
        if (polling) return;             // already asking; the retry owns it
        status(false, 'reconnecting…');
        setTimeout(function () { if (!polling) stream(); }, 3000);
      });
  }

  var recentre = document.getElementById('recentre');
  recentre.onclick = function () { fit(); };

  loadFences();
  stream();

  // Keeps «live · 4m left» and «2m ago» from going stale between updates.
  setInterval(render, 1000);
  // And the beams: somebody who stopped a few minutes ago is not heading
  // anywhere now, and no update will come to say so.
  setInterval(function () { people.forEach(aimAt); }, 5000);
})();
</script>
</body>
</html>
