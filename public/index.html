<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Live locations</title>
<!-- Served from this host. Nothing on this page reaches a third party: on a
     network that filters things, a CDN is one more way for the map to vanish. -->
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root{
    --ink:#14181d; --paper:#fff; --quiet:#6b7480; --hairline:#e3e6ea;
    --live:#0a7d33; --stale:#9aa3ad;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8eaed; --paper:#14181d; --quiet:#9aa3ad; --hairline:#2a2f36; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--paper);
    height:100svh;display:grid;grid-template-rows:auto 1fr;
  }
  header{
    display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
    padding:.7rem 1rem;border-bottom:1px solid var(--hairline);
  }
  h1{font-size:1rem;font-weight:600;letter-spacing:-.01em}
  .count{color:var(--quiet);font-size:.85rem}
  .conn{
    margin-left:auto;display:inline-flex;align-items:center;gap:.4rem;
    font-size:.8rem;color:var(--quiet);
  }
  .conn i{width:.5rem;height:.5rem;border-radius:50%;background:var(--stale);display:block}
  .conn.up i{background:var(--live)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 19rem;min-height:0}
  @media (max-width:760px){ main{grid-template-columns:1fr;grid-template-rows:1fr auto} }
  #map{height:100%;width:100%;background:var(--paper)}
  @media (prefers-color-scheme: dark){
    .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
  }
  aside{
    border-left:1px solid var(--hairline);overflow-y:auto;padding:.5rem;
    display:flex;flex-direction:column;gap:.4rem;
  }
  @media (max-width:760px){ aside{border-left:none;border-top:1px solid var(--hairline);max-height:38vh} }
  .person{
    border:1px solid var(--hairline);border-radius:10px;padding:.6rem .7rem;
    cursor:pointer;background:none;color:inherit;text-align:left;font:inherit;
    display:grid;gap:.15rem;
  }
  .person:hover{border-color:var(--quiet)}
  .person .who{display:flex;align-items:center;gap:.4rem;font-weight:600}
  .person .who i{width:.5rem;height:.5rem;border-radius:50%;background:var(--stale);flex:none}
  .person.live .who i{background:var(--live);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){ .person.live .who i{animation:none} }
  .person .meta{font-size:.8rem;color:var(--quiet);font-variant-numeric:tabular-nums}
  .empty{color:var(--quiet);font-size:.88rem;padding:1rem;text-align:center}
  /* Spotlight: the map recedes so one path can be read against it. The dark
     theme already filters the tiles, so its rule has to carry both. */
  .leaflet-tile-pane{transition:filter .18s ease}
  body.spotlight .leaflet-tile-pane{filter:grayscale(.8) opacity(.4)}
  @media (prefers-color-scheme: dark){
    body.spotlight .leaflet-tile-pane{
      filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) grayscale(.8) opacity(.4);
    }
  }
  body.spotlight .person{opacity:.45;transition:opacity .18s ease}
  body.spotlight .person.lit{opacity:1;border-color:var(--ink)}
  .person.lit{border-color:var(--ink)}

  .ghost{
    font:inherit;font-size:.8rem;color:var(--quiet);background:none;cursor:pointer;
    border:1px solid var(--hairline);border-radius:999px;padding:.15rem .6rem;
  }
  .ghost:hover{border-color:var(--quiet);color:var(--ink)}
  .card .ghost.share{margin-top:.45rem}
  .shared{margin-top:.45rem;display:grid;gap:.2rem}
  .shared input{
    font:inherit;font-size:.78rem;width:100%;padding:.25rem .4rem;
    border:1px solid var(--hairline);border-radius:6px;background:var(--paper);color:var(--ink);
  }
  .shared .meta{font-size:.72rem;color:var(--quiet)}
  /* The card behind a marker: a face and a handle, so a dot stops being a number. */
  .card{display:flex;gap:.6rem;align-items:center;min-width:11rem}
  .card img,.card .noface{
    width:3rem;height:3rem;border-radius:50%;flex:none;object-fit:cover;
    background:var(--hairline);display:grid;place-items:center;
    font-weight:600;color:var(--quiet);
  }
  .card .cname{font-weight:600;line-height:1.3}
  .card .chandle{font-size:.82rem;color:var(--quiet)}
  .card .cid{font-size:.75rem;color:var(--quiet);font-variant-numeric:tabular-nums;opacity:.7}
  .leaflet-popup-content{margin:.7rem .8rem}
  /* The time under the pointer. A label, not a card: it follows the cursor. */
  .time-tip{font:600 .78rem/1.3 ui-sans-serif,system-ui,sans-serif;padding:.2rem .45rem;
            border-radius:.35rem;white-space:nowrap}
  .time-tip .quiet{font-weight:400;opacity:.7}
  /* A fence is a place, not a person: drawn quietly, under everything else. */
  .fencing #map{cursor:crosshair}
  .fencing #newfence{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .fence-label{font-size:.72rem;font-weight:600;color:var(--quiet);
               background:none;border:none;box-shadow:none;padding:0}
</style>
</head>
<body>
<header>
  <h1>Live locations</h1>
  <span class="count" id="count"></span>
  <button class="ghost" id="recentre" type="button" hidden>Recentre</button>
  <button class="ghost" id="newfence" type="button" hidden>New fence</button>
  <span class="conn" id="conn"><i></i><span>connecting…</span></span>
</header>
<main>
  <div id="map"></div>
  <aside id="list"><p class="empty">Nobody is sharing a location yet.</p></aside>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/lib/path-time.js"></script>
<script>
(function () {
  var map = L.map('map', {
    zoomControl: true,
    // Pan past the dateline and the world keeps going, with the markers
    // following you into the copy you are looking at.
    worldCopyJump: true,
    // Far enough out to see a continent, never so far that the whole world
    // shrinks into a band with empty space above and below it.
    minZoom: 3
  }).setView([35.6892, 51.389], 13);

  // Proxied and cached by this service rather than fetched from OSM directly,
  // so the browser only ever talks to the host it loaded the page from. The
  // attribution stays either way — it is a condition of using the data, not a
  // consequence of where the bytes came from.
  L.tileLayer('/tiles/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  // Leaflet measures the container when the map is built, and this one is
  // sized by a CSS grid that may not have settled yet. Measured too early it
  // renders tiles for a viewport that no longer exists — a narrow strip of
  // map floating in a large empty box. Re-measuring costs nothing.
  function resize() { map.invalidateSize({ animate: false }); }
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  setTimeout(resize, 0);
  setTimeout(resize, 250);

  var people = new Map();   // id -> { data, marker, halo, path }
  var fitted = false;

  function live(p) { return p.live || (p.liveUntil && p.liveUntil * 1000 > Date.now()); }

  function ago(at) {
    var s = Math.max(0, Math.round(Date.now() / 1000 - at));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    return Math.round(s / 3600) + 'h ago';
  }

  function left(p) {
    if (!p.liveUntil) return '';
    var s = Math.max(0, p.liveUntil - Math.round(Date.now() / 1000));
    if (s <= 0) return '';
    return s > 3600 ? Math.round(s / 3600) + 'h left' : Math.max(1, Math.round(s / 60)) + 'm left';
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // id -> { name, username, photo } once Telegram has been asked, or null
  // while the asking is in flight. The server caches too; this only keeps the
  // page from asking again on every mousemove.
  var identities = new Map();
  function identify(id) {
    if (identities.has(id)) return Promise.resolve(identities.get(id));
    identities.set(id, null);
    return fetch('/api/person/' + encodeURIComponent(id), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (who) { identities.set(id, who); return who; })
      .catch(function () { identities.set(id, null); return null; });
  }

  // What to call someone: their handle if Telegram told us, then whatever name
  // rode along on the message, and the bare id only as a last resort.
  function label(p) {
    var who = identities.get(p.id);
    if (who && who.username) return who.username;
    if (who && who.name) return who.name;
    return p.name || p.id;
  }

  // Place names, cached by coordinates rounded to about eleven metres — a
  // person standing still asks once, not once per second.
  var places = new Map();
  function placeKey(lat, lon) { return lat.toFixed(4) + ',' + lon.toFixed(4); }
  function placeOf(lat, lon) {
    var key = placeKey(lat, lon);
    if (places.has(key)) return Promise.resolve(places.get(key));
    places.set(key, '');
    return fetch('/api/place?lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon),
                 { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { var v = (d && d.place) || ''; places.set(key, v); return v; })
      .catch(function () { return ''; });
  }

  // Where someone is, in words if PostGIS could say and in numbers if not.
  function whereabouts(p) {
    if (p.latitude === null) return '—';
    var known = places.get(placeKey(p.latitude, p.longitude));
    return known || (p.latitude.toFixed(5) + ', ' + p.longitude.toFixed(5));
  }

  function card(p) {
    var who = identities.get(p.id);
    var title = (who && (who.name || who.username)) || p.name || '';
    var face = who && who.photo
      ? '<img src="/api/photo/' + encodeURIComponent(p.id) + '" alt="" />'
      : '<div class="noface">' + esc((title || '?').trim().charAt(0).toUpperCase() || '?') + '</div>';
    return '<div class="card">' + face + '<div>' +
      '<div class="cname">' + esc(title || p.id) + '</div>' +
      (who && who.username ? '<div class="chandle">' + esc(who.username) + '</div>' : '') +
      '<div class="cid">' + esc(p.id) + '</div>' +
      '<div class="chandle">' + esc(whereabouts(p)) + '</div>' +
      ((p.trail || []).length > 1
        ? '<button class="ghost share" data-id="' + esc(p.id) + '">Share this path</button>'
        : '') +
      '</div></div>';
  }

  // Opening the card is what pulls the photo — hovering should stay cheap.
  // Handing a path to somebody without the dashboard. The link is a frozen
  // copy, not a window that keeps following them, and it expires.
  function share(id, button) {
    button.disabled = true;
    button.textContent = 'sharing…';
    fetch('/api/share/' + encodeURIComponent(id), { method: 'POST', credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d && res.d.error);
        var link = location.origin + res.d.path;
        var days = Math.round(res.d.expiresIn / 86400);
        button.outerHTML =
          '<div class="shared"><input readonly value="' + esc(link) + '" />' +
          '<span class="meta">expires in ' + days + ' day' + (days === 1 ? '' : 's') + '</span></div>';
        var input = document.querySelector('.shared input');
        if (input) { input.focus(); input.select(); }
      })
      .catch(function (e) {
        button.disabled = false;
        button.textContent = (e && e.message) === 'no database' ? 'needs PostGIS' : 'could not share';
      });
  }

  function openCard(p, marker) {
    // autoPan off: opening a card must not shove the map. Lighting a path
    // fits the whole of it, and a popup panning to make room for itself
    // undoes that immediately.
    marker.bindPopup(card(p), { minWidth: 180, autoPan: false }).openPopup();
    identify(p.id).then(function () {
      if (marker.isPopupOpen()) marker.setPopupContent(card(p));
    });
  }

  // Which path is being looked at. `lit` is pinned by a click or a tap and
  // stays; `hovered` is transient and only exists on a device with a pointer.
  var lit = null;
  var hovered = null;
  // Separate from `hovered` because a marker and its path are hovered by
  // different things, and one leaving must not unlight the other.
  var pathHover = null;

  function shine() {
    var id = lit || hovered || pathHover;
    document.body.classList.toggle('spotlight', Boolean(id));
    // The row follows the map. It used to be marked only when the list was
    // rebuilt, so lighting somebody by hovering dimmed their own row with
    // everyone else's.
    document.querySelectorAll('#list .person').forEach(function (row) {
      row.classList.toggle('lit', Boolean(id) && row.dataset.id === String(id));
    });

    people.forEach(function (e, key) {
      if (!e.data) return;
      var focus = Boolean(id) && key === id;
      var dim = Boolean(id) && !focus;

      if (e.marker) {
        e.marker.setStyle({ opacity: dim ? .2 : 1, fillOpacity: dim ? .25 : 1 });
        e.marker.setRadius(focus ? 9 : 7);
      }
      if (e.halo) e.halo.setStyle({ opacity: dim ? .05 : .3, fillOpacity: dim ? .01 : .06 });
      if (e.path) {
        e.path.setStyle({
          opacity: focus ? 1 : (dim ? .08 : .45),
          weight: focus ? 4 : 2,
          // Solid when lit: a dashed line reads as provisional, and this is
          // the one thing being asserted.
          dashArray: focus ? null : '4 4',
        });
      }

      // A wider, softer line underneath is what makes it look lit rather than
      // merely thicker.
      if (focus && e.path) {
        var pts = e.path.getLatLngs();
        if (!e.glow) {
          e.glow = L.polyline(pts, {
            weight: 14, opacity: .2, lineCap: 'round', lineJoin: 'round',
            color: e.path.options.color,
          }).addTo(map);
        }
        e.glow.setLatLngs(pts).setStyle({ color: e.path.options.color });
        e.glow.bringToBack();
      } else if (e.glow) {
        map.removeLayer(e.glow);
        e.glow = null;
      }
    });
  }

  function pin(id) {
    lit = (lit === id) ? null : id;
    if (lit) loadHistory(lit);
    shine();
  }

  // ------------------------------------------------ what time it was there
  //
  // The live trail is the last TRAIL_MAX fixes, which on a busy day is the
  // last hour. Lighting a person asks for their last day from history, which
  // is recorded and until now was never drawn.
  var historyAsked = {};
  function loadHistory(id) {
    if (historyAsked[id]) return;
    historyAsked[id] = true;
    var since = Math.floor(Date.now() / 1000) - 86400;
    fetch('/api/history/' + encodeURIComponent(id) + '?since=' + since, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var e = people.get(id);
        if (!d || !d.points || !d.points.length || !e || !e.data) return;
        e.history = d.points;
        draw(e.data);
        shine();
      })
      .catch(function () { historyAsked[id] = false; });
  }

  // How far from a line a pointer can be and still mean it. A thin dashed
  // line is hard to land on exactly, and a finger is wider than a cursor.
  var REACH = 12;

  // The nearest drawn path to a point on screen, if any is close enough.
  // Only the lit one while something is pinned, so moving across the map
  // does not flick between people.
  function pathHit(pt) {
    var best = null;
    var ids = lit ? [lit] : Array.from(people.keys());
    ids.forEach(function (id) {
      var e = people.get(id);
      if (!e || !e.path || !e.pts || e.pts.length < 2) return;
      var px = e.pts.map(function (q) { return map.latLngToContainerPoint([q.latitude, q.longitude]); });
      var hit = PathTime.nearestSegment(px, pt);
      if (hit && hit.distance <= REACH && (!best || hit.distance < best.hit.distance)) {
        best = { id: id, e: e, hit: hit, px: px };
      }
    });
    return best;
  }

  function clock(at) {
    var d = new Date(at * 1000);
    var hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    // Yesterday's 14:32 is not today's; history reaches back a day.
    return d.toDateString() === new Date().toDateString()
      ? hm
      : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + hm;
  }

  var timeTip = L.tooltip({ direction: 'top', offset: [0, -8], className: 'time-tip', opacity: 1 });

  function showTime(found) {
    var e = found.e;
    var h = found.hit;
    var a = e.pts[h.index];
    var b = e.pts[h.index + 1];
    var at = PathTime.timeAt(e.pts.map(function (q) { return q.at; }), h.index, h.t);
    if (at === null) { hideTime(); return; }

    // Exact at a fix, estimated between two. Within a few pixels of a fix
    // the reader is pointing at it, and it would be odd to call that a guess.
    var len = found.px[h.index].distanceTo(found.px[h.index + 1]);
    var exact = Math.min(h.t, 1 - h.t) * len < 6;
    var speed = PathTime.speedLabel(PathTime.speedBetween(a, b));

    var where = L.latLng(
      a.latitude + (b.latitude - a.latitude) * h.t,
      a.longitude + (b.longitude - a.longitude) * h.t
    );
    timeTip.setLatLng(where).setContent(
      (exact ? '' : '≈ ') + esc(clock(at))
      + ' <span class="quiet">· ' + esc(ago(at)) + (speed ? ' · ' + esc(speed) : '') + '</span>'
    );
    if (!map.hasLayer(timeTip)) timeTip.addTo(map);
  }

  function hideTime() { if (map.hasLayer(timeTip)) map.removeLayer(timeTip); }

  // Coalesced to one check per frame: projecting every fix on every mousemove
  // is cheap for a handful of people, but not free.
  var frame = 0;
  var pointer = null;
  map.on('mousemove', function (ev) {
    pointer = ev.containerPoint;
    if (frame) return;
    frame = requestAnimationFrame(function () {
      frame = 0;
      if (arming || !pointer) return;
      var found = pathHit(pointer);
      var want = found ? found.id : null;
      if (!lit && want !== pathHover) { pathHover = want; shine(); }
      if (found) showTime(found); else hideTime();
    });
  });
  map.on('mouseout', function () {
    pointer = null;
    hideTime();
    if (pathHover) { pathHover = null; shine(); }
  });

  // A tap on a path is how a touch screen asks the same question, since it
  // has no hover. A tap anywhere else puts everything back.
  map.on('click', function (ev) {
    if (arming) return;
    var found = pathHit(ev.containerPoint);
    if (found) {
      if (lit !== found.id) { lit = found.id; loadHistory(lit); shine(); }
      showTime(found);
      return;
    }
    lit = null; hovered = null; pathHover = null;
    hideTime();
    shine();
  });

  // Delegated: the card's markup is replaced when the identity lookup lands,
  // so a handler bound to the button would not survive it.
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button.share');
    if (!b) return;
    e.preventDefault();
    share(b.getAttribute('data-id'), b);
  });

  function draw(p) {
    if (p.latitude === null || p.longitude === null) return;
    var here = [p.latitude, p.longitude];
    var entry = people.get(p.id) || {};
    entry.data = p;

    var colour = live(p) ? getComputedStyle(document.documentElement).getPropertyValue('--live').trim() || '#0a7d33'
                         : '#8a929b';
    if (!entry.marker) {
      entry.marker = L.circleMarker(here, { radius: 7, weight: 3, fillColor: '#fff', fillOpacity: 1 }).addTo(map);
    }
    entry.marker.setLatLng(here).setStyle({ color: colour });

    if (!entry.wired) {
      entry.wired = true;
      entry.marker.bindTooltip(label(p), { permanent: false });
      // Hovering resolves the id to a handle; the tooltip is rewritten once
      // the answer lands, so the first hover shows the number only briefly.
      entry.marker.on('mouseover', function () {
        hovered = p.id;
        shine();
        identify(p.id).then(function () { entry.marker.setTooltipContent(label(entry.data)); });
      });
      entry.marker.on('mouseout', function () { hovered = null; shine(); });
      entry.marker.on('click', function (e) {
        // Without this the map's own click handler fires too and immediately
        // unpins what was just pinned.
        L.DomEvent.stopPropagation(e);
        pin(p.id);
        openCard(entry.data, entry.marker);
      });
    } else {
      entry.marker.setTooltipContent(label(p));
    }

    if (p.accuracy) {
      if (!entry.halo) entry.halo = L.circle(here, { weight: 1, opacity: .3, fillOpacity: .06, color: colour }).addTo(map);
      entry.halo.setLatLng(here).setRadius(p.accuracy).setStyle({ color: colour });
    }

    // Every fix keeps its time beside it; the hover asks for it by index.
    entry.pts = PathTime.merge(entry.history, p.trail);
    var line = entry.pts.map(function (t) { return [t.latitude, t.longitude]; });
    if (line.length > 1) {
      if (!entry.path) entry.path = L.polyline(line, { weight: 2, opacity: .45, dashArray: '4 4', color: colour }).addTo(map);
      else entry.path.setLatLngs(line).setStyle({ color: colour });
      if (entry.glow) entry.glow.setLatLngs(line);
    }

    people.set(p.id, entry);

    // Fit once, to everyone. After that the map stays where it was put: a
    // view that jumps to whoever moved last is unusable the moment two people
    // are sharing, so recentring is a button rather than a surprise.
    if (!fitted) { fit(); fitted = true; }
  }

  function fit() {
    var pts = [];
    people.forEach(function (e) {
      if (e.data && e.data.latitude !== null) pts.push([e.data.latitude, e.data.longitude]);
    });
    if (!pts.length) return;
    if (pts.length === 1) map.setView(pts[0], 15);
    else map.fitBounds(L.latLngBounds(pts).pad(0.25));
  }

  function render() {
    var list = document.getElementById('list');
    var rows = Array.from(people.values()).map(function (e) { return e.data; })
      .sort(function (a, b) { return b.at - a.at; });

    document.getElementById('count').textContent =
      rows.length ? rows.length + (rows.length === 1 ? ' person' : ' people') : '';
    document.getElementById('recentre').hidden = !rows.length;

    if (lit && !people.has(lit)) { lit = null; shine(); }
    if (hovered && !people.has(hovered)) { hovered = null; shine(); }

    if (!rows.length) { list.innerHTML = '<p class="empty">Nobody is sharing a location yet.</p>'; return; }

    list.innerHTML = '';
    rows.forEach(function (p) {
      var el = document.createElement('button');
      el.className = 'person' + (live(p) ? ' live' : '') + ((lit || hovered || pathHover) === p.id ? ' lit' : '');
      el.dataset.id = p.id;
      el.innerHTML =
        '<span class="who"><i></i>' + esc(label(p)) + '</span>' +
        '<span class="meta">' +
          (p.stopped ? 'stopped · ' : '') +
          (live(p) ? 'live · ' + left(p) + ' · ' : '') + ago(p.at) +
        '</span>' +
        '<span class="meta">' + esc(whereabouts(p)) + '</span>';

      // Kicks off the lookup; the next render picks up the answer.
      if (p.latitude !== null) placeOf(p.latitude, p.longitude);
      // Rows resolve lazily too, so a list of numbers fills in with handles.
      identify(p.id).then(function (who) {
        if (who && (who.username || who.name)) {
          var who_el = el.querySelector('.who');
          if (who_el) who_el.innerHTML = '<i></i>' + esc(label(p));
        }
      });
      // The list is the other way in: hovering a row lights the same path the
      // marker does, and on a touch screen tapping one is the only way in.
      el.onmouseenter = function () { hovered = p.id; shine(); };
      el.onmouseleave = function () { hovered = null; shine(); };
      el.onclick = function () {
        pin(p.id);
        if (p.latitude === null) return;
        var entry = people.get(p.id);
        // Fit the whole path when lighting one, rather than zooming to the
        // last point — the point of lighting it is to see where it went.
        if (lit === p.id && entry && entry.path && (entry.pts || []).length > 1) {
          map.fitBounds(entry.path.getBounds().pad(0.25));
        } else {
          map.setView([p.latitude, p.longitude], 16);
        }
        if (entry && entry.marker) openCard(p, entry.marker);
      };
      list.appendChild(el);
    });
  }

  function apply(p) { draw(p); render(); }

  var conn = document.getElementById('conn');
  function status(up, text) {
    conn.className = 'conn' + (up ? ' up' : '');
    conn.lastElementChild.textContent = text;
  }

  // ------------------------------------------------------------- fences
  //
  // Drawn as the polygon PostGIS actually stores rather than as a circle, so
  // what is on screen is what the boundary test uses. ST_Buffer makes a
  // thirty-two sided ring, which at any useful zoom is a circle.
  var fenceLayer = L.layerGroup().addTo(map);
  var arming = false;

  function drawFences(list) {
    fenceLayer.clearLayers();
    (list || []).forEach(function (f) {
      if (!f.ring || f.ring.length < 3) return;
      var shape = L.polygon(f.ring, {
        color: '#7a6ff0', weight: 1.5, opacity: .7,
        fillColor: '#7a6ff0', fillOpacity: .07, interactive: true
      }).addTo(fenceLayer);
      // Above the centre rather than on it: a fence usually has somebody
      // standing in the middle of it, and the label was landing under them.
      shape.bindTooltip(f.name, { permanent: true, direction: 'top', className: 'fence-label' });
      // Under the paths, always: fences are redrawn whenever one changes, and
      // redrawn last they would otherwise sit on top of everything.
      shape.bringToBack();
      shape.on('click', function (e) {
        // Only swallow the click when it means something here. Stopping it
        // unconditionally made the inside of an existing fence a dead zone:
        // the map never saw the click, so a new fence could not overlap an
        // old one.
        if (arming) return;
        // A tap near a path inside a fence is a question about the path, and
        // letting it bubble means the map's handler answers it. Otherwise
        // asking the time of anywhere near home offered to delete home.
        if (pathHit(e.containerPoint)) return;
        L.DomEvent.stopPropagation(e);
        if (!window.confirm('Remove the fence “' + f.name + '”?')) return;
        fetch('/api/fences/' + encodeURIComponent(f.id), { method: 'DELETE' })
          .then(loadFences)
          .catch(function () { /* the list redraws on the next change anyway */ });
      });
    });
  }

  function loadFences() {
    return fetch('/api/fences', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        // 503 means no PostGIS, which is an ordinary state: fences are a
        // capability, like place names. The button simply stays hidden.
        if (!d) return;
        document.getElementById('newfence').hidden = false;
        drawFences(d.fences);
      })
      .catch(function () {});
  }

  function arm(on) {
    arming = on;
    document.body.classList.toggle('fencing', on);
    document.getElementById('newfence').textContent = on ? 'Click the map…' : 'New fence';
  }

  document.getElementById('newfence').onclick = function () { arm(!arming); };

  map.on('click', function (e) {
    if (!arming) return;
    arm(false);
    var name = window.prompt('What is this place called?');
    if (!name) return;
    var radius = Number(window.prompt('How far across, in metres?', '150'));
    if (!radius || radius < 25 || radius > 50000) {
      window.alert('A fence needs a radius between 25 m and 50 km.');
      return;
    }
    var q = '?name=' + encodeURIComponent(name)
      + '&lat=' + e.latlng.lat + '&lon=' + e.latlng.lng + '&radius=' + radius;
    fetch('/api/fences' + q, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.error) window.alert(d.error); return loadFences(); })
      .catch(function () { window.alert('Could not save that fence.'); });
  });

  function drop(id) {
    var entry = people.get(id);
    if (!entry) return false;
    ['marker', 'halo', 'path'].forEach(function (k) { if (entry[k]) map.removeLayer(entry[k]); });
    people.delete(id);
    return true;
  }

  // Asking, rather than being told. This is the fallback, not the plan: it
  // cannot show a change sooner than the next ask, and it re-sends everyone
  // each time.
  var polling = null;
  var attempt = null;

  function stopPolling() {
    if (!polling) return;
    clearInterval(polling.ask);
    clearInterval(polling.retry);
    polling = null;
  }

  function ask() {
    fetch('/api/positions', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { status(false, 'offline'); return; }
        if (polling) status(true, 'polling');
        var seen = {};
        d.people.forEach(function (p) { seen[p.id] = true; draw(p); });
        // Nothing announces a departure here, so it has to be noticed: anyone
        // the server no longer lists has gone.
        Array.from(people.keys()).forEach(function (id) { if (!seen[id]) drop(id); });
        render();
      })
      .catch(function () { status(false, 'offline'); });
  }

  function poll() {
    if (polling) return;
    status(true, 'polling');
    // Falling back is not a verdict. Whatever was holding the stream may be
    // taken out of the path — a tunnel swapped for a Worker, a proxy
    // reconfigured — and a page that never looked again would stay slow for
    // as long as it stayed open. That is what «stuck in polling» was.
    polling = { ask: setInterval(ask, 5000), retry: setInterval(stream, 60000) };
    ask();
  }

  function event(chunk) {
    var name = '', data = '';
    chunk.split('\n').forEach(function (line) {
      if (line.slice(0, 6) === 'event:') name = line.slice(6).trim();
      else if (line.slice(0, 5) === 'data:') data += line.slice(5).trim();
    });
    if (!name) return;
    // Anything at all means the stream is delivering, heartbeats included.
    stopPolling();
    status(true, 'live');
    if (name === 'beat') return;
    var d = data ? JSON.parse(data) : {};
    if (name === 'hello') { d.people.forEach(apply); render(); }
    else if (name === 'position') apply(d);
    else if (name === 'forget') { if (drop(d.id)) render(); }
    // Either a fence was added or removed, or somebody crossed one. Both mean
    // the drawn set may be stale, and redrawing is one small request.
    else if (name === 'fence') loadFences();
  }

  // Read by hand over POST rather than with EventSource, for one reason:
  // cloudflared holds a server-sent stream on a GET until the connection
  // closes, and delivers the same stream over POST as it arrives
  // (cloudflare/cloudflared#1449). EventSource can only ever issue a GET, so
  // behind a tunnel it is buffered whatever the server does. The cost is
  // reconnection and parsing, which EventSource used to do for us and which
  // is the rest of this function.
  function stream() {
    if (attempt) attempt.abort();
    var ctl = new AbortController();
    attempt = ctl;
    var last = 0;
    var started = Date.now();

    // Two windows, because they are different failures wearing the same face:
    // eight seconds to say hello at all, then seventy of silence on a stream
    // that did — long enough for two missed heartbeats. Without the second, a
    // stream that quietly stopped delivering read as «live» above a map that
    // was no longer being updated, which is the worst of the three states.
    var watch = setInterval(function () {
      if (attempt !== ctl) { clearInterval(watch); return; }
      if (Date.now() - (last || started) > (last ? 70000 : 8000)) {
        clearInterval(watch);
        ctl.abort();
        poll();
      }
    }, 2000);

    fetch('/api/stream', { method: 'POST', cache: 'no-store', signal: ctl.signal })
      .then(function (r) {
        if (!r.ok || !r.body) throw new Error('no stream');
        var reader = r.body.getReader();
        var dec = new TextDecoder();
        var buf = '';
        return (function pump() {
          return reader.read().then(function (step) {
            if (step.done) throw new Error('ended');
            last = Date.now();
            buf += dec.decode(step.value, { stream: true });
            // A blank line ends an event; whatever follows the last one is the
            // beginning of the next and waits for the rest of itself.
            var parts = buf.split('\n\n');
            buf = parts.pop();
            parts.forEach(event);
            return pump();
          });
        })();
      })
      .catch(function () {
        clearInterval(watch);
        if (attempt !== ctl) return;     // a newer attempt has taken over
        attempt = null;
        if (polling) return;             // already asking; the retry owns it
        status(false, 'reconnecting…');
        setTimeout(function () { if (!polling) stream(); }, 3000);
      });
  }

  var recentre = document.getElementById('recentre');
  recentre.onclick = function () { fit(); };

  loadFences();
  stream();

  // Keeps «live · 4m left» and «2m ago» from going stale between updates.
  setInterval(render, 1000);
})();
</script>
</body>
</html>
