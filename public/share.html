<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>A shared path</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root{ --ink:#14181d; --paper:#fff; --quiet:#6b7480; --hairline:#e3e6ea; --live:#0a7d33 }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8eaed; --paper:#14181d; --quiet:#9aa3ad; --hairline:#2a2f36 }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--paper);
    height:100svh;display:grid;grid-template-rows:auto 1fr;
  }
  header{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;
         padding:.7rem 1rem;border-bottom:1px solid var(--hairline)}
  h1{font-size:1rem;font-weight:600;letter-spacing:-.01em}
  .meta{color:var(--quiet);font-size:.85rem}
  #map{height:100%;width:100%;background:var(--paper)}
  @media (prefers-color-scheme: dark){
    .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
  }
  .gone{padding:2rem;text-align:center;color:var(--quiet)}
  .time-tip{font:600 .78rem/1.3 ui-sans-serif,system-ui,sans-serif;padding:.2rem .45rem;
            border-radius:.35rem;white-space:nowrap}
  .time-tip .quiet{font-weight:400;opacity:.7}
  header a.dl{margin-left:auto;font-size:.8rem;color:var(--quiet);text-decoration:none;
              border:1px solid var(--hairline);border-radius:999px;padding:.15rem .6rem}
  header a.dl:hover{color:var(--ink);border-color:var(--quiet)}
  /* Where the path goes out of view: its real start and end are not shown,
     and neither is anything inside a private place, so the line fades out
     there rather than stopping at a point that would look like the truth. */
  .fade-end{width:26px;height:26px;border-radius:50%;filter:blur(2px);opacity:.7}
</style>
</head>
<body>
<header>
  <h1 id="who">A shared path</h1>
  <span class="meta" id="when"></span>
  <a class="dl" id="gpx" href="#" download hidden>Download GPX</a>
</header>
<div id="map"></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/lib/path-time.js"></script>
<script>
(function () {
  // The token is the last segment of the path this page was served from, and
  // it is also what admits the tiles below — this page has no other key.
  var token = location.pathname.split('/').filter(Boolean).pop() || '';

  var map = L.map('map', { zoomControl: true, worldCopyJump: true, minZoom: 3 });
  L.tileLayer('/tiles/{z}/{x}/{y}.png?s=' + encodeURIComponent(token), {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  function resize() { map.invalidateSize({ animate: false }); }
  window.addEventListener('resize', resize);
  setTimeout(resize, 0);

  function ago(at) {
    var s = Math.max(0, Math.round(Date.now() / 1000 - at));
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' minutes ago';
    if (s < 86400) return Math.round(s / 3600) + ' hours ago';
    return Math.round(s / 86400) + ' days ago';
  }

  // Hovering the path, or tapping it, says when that part was travelled.
  // The same helper and the same honesty as the dashboard: exact at a fix,
  // marked ≈ between two. A share made before times were kept says so.
  function whenWasI(pts, times) {
    var tip = L.tooltip({ direction: 'top', offset: [0, -8], className: 'time-tip', opacity: 1 });
    var esc = function (v) {
      return String(v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };
    function when(at) {
      var d = new Date(at * 1000);
      // A share is read days later, so the day always matters here.
      return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })
        + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function ask(pt) {
      // A gap is where the path resumes after a hidden stretch: there is no
      // segment across it to hover, and no time to read off one.
      var px = pts.map(function (q) {
        var pt = map.latLngToContainerPoint([q.latitude, q.longitude]);
        if (q.gap) pt.gap = true;
        return pt;
      });
      var h = PathTime.nearestSegment(px, pt);
      if (!h || h.distance > 12) { if (map.hasLayer(tip)) map.removeLayer(tip); return; }
      var a = pts[h.index];
      var b = pts[h.index + 1];
      var where = L.latLng(a.latitude + (b.latitude - a.latitude) * h.t,
                           a.longitude + (b.longitude - a.longitude) * h.t);
      var at = PathTime.timeAt(times, h.index, h.t);
      var text;
      if (at === null) {
        text = '<span class="quiet">time not recorded</span>';
      } else {
        var exact = Math.min(h.t, 1 - h.t) * px[h.index].distanceTo(px[h.index + 1]) < 6;
        var speed = PathTime.speedLabel(PathTime.speedBetween(a, b));
        text = (exact ? '' : '≈ ') + esc(when(at)) + (speed ? ' <span class="quiet">· ' + esc(speed) + '</span>' : '');
      }
      tip.setLatLng(where).setContent(text);
      if (!map.hasLayer(tip)) tip.addTo(map);
    }
    var frame = 0;
    var pointer = null;
    map.on('mousemove', function (ev) {
      pointer = ev.containerPoint;
      if (frame) return;
      frame = requestAnimationFrame(function () { frame = 0; if (pointer) ask(pointer); });
    });
    map.on('mouseout', function () { pointer = null; if (map.hasLayer(tip)) map.removeLayer(tip); });
    map.on('click', function (ev) { ask(ev.containerPoint); });
  }

  fetch('/api/shared/' + encodeURIComponent(token))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !d.points || d.points.length < 2) {
        document.body.innerHTML = '<p class="gone">This link has expired, or the path behind it was removed.</p>';
        return;
      }
      if (d.name) document.getElementById('who').textContent = d.name + '’s path';
      // The first and last few hundred metres are always left out, so the
      // ends shown are never somebody's door. Saying so is part of the page.
      document.getElementById('when').textContent = 'shared ' + ago(d.at) + ' · the first and last stretch are left out';
      var dl = document.getElementById('gpx');
      dl.href = '/api/shared/' + encodeURIComponent(token) + '?format=gpx';
      dl.hidden = false;

      var breaks = {};
      (d.breaks || []).forEach(function (i) { breaks[i] = true; });
      var pts = d.points.map(function (p, i) {
        var q = { latitude: p[0], longitude: p[1], at: d.times ? d.times[i] : null };
        if (breaks[i]) q.gap = true;
        return q;
      });
      var runs = PathTime.runs(pts);
      var lines = runs.filter(function (r) { return r.length > 1; })
        .map(function (r) { return r.map(function (q) { return [q.latitude, q.longitude]; }); });

      var colour = getComputedStyle(document.documentElement).getPropertyValue('--live').trim() || '#0a7d33';
      // The same two-line treatment the dashboard uses when a path is lit:
      // a wide soft line under a solid one.
      L.polyline(lines, { weight: 14, opacity: .2, color: colour, lineCap: 'round', lineJoin: 'round' }).addTo(map);
      var line = L.polyline(lines, { weight: 4, opacity: 1, color: colour }).addTo(map);

      // No start and end markers: the real ones are not shown. Each end of
      // each stretch fades out instead.
      var fade = function (q, tip) {
        L.marker([q.latitude, q.longitude], {
          icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
            html: '<div class="fade-end" style="background:radial-gradient(closest-side,' + colour + ',transparent)"></div>' }),
          keyboard: false,
        }).addTo(map).bindTooltip(tip);
      };
      runs.forEach(function (run, k) {
        fade(run[0], k === 0 ? 'the path starts before here' : 'back in view');
        fade(run[run.length - 1], k === runs.length - 1 ? 'and goes on after here' : 'out of view');
      });

      map.fitBounds(line.getBounds().pad(0.2));
      whenWasI(pts, d.times);
    })
    .catch(function () {
      document.body.innerHTML = '<p class="gone">This link could not be opened.</p>';
    });
})();
</script>
</body>
</html>
