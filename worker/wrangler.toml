# The dashboard's front door. See worker/src/index.js for what it does and why.
#
# Deploy:
#   cd worker
#   npx wrangler secret put ORIGIN            # http://<hostname>:8080, never an IP
#   npx wrangler secret put EDGE_KEY          # must match EDGE_KEY on the VPS
#   npx wrangler secret put DASHBOARD_TOKEN   # same value the service uses
#   npx wrangler deploy
#
# All three are secrets rather than vars: ORIGIN reveals where the service
# lives, and the other two are credentials.

name = "livegeo"
main = "src/index.js"
# Must stay on or after 2024-09-02. Before that date a subrequest silently
# drops the port, so ORIGIN's :8080 would become :80 and the proxy would fail
# with nothing to indicate why.
compatibility_date = "2026-09-01"

# Only the vendored files are uploaded: Leaflet, and the font for the district
# name. Pointing this at ../public would publish index.html, which belongs
# behind the origin's token check.
[assets]
directory = "../public/vendor"
binding = "ASSETS"

# Everything the page asks for is routed by the Worker itself, so assets must
# not be served ahead of it.
run_worker_first = true
