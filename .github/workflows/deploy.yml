name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A deploy that started earlier should not overwrite a newer one; let the
# running build finish rather than cancelling it mid-push.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Package names must be lowercase; repository owners need not be.
      - id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sign in to the registry
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build
        run: |
          docker build \
            --tag '${{ steps.name.outputs.image }}:main' \
            --tag '${{ steps.name.outputs.image }}:${{ github.sha }}' \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

      # Proves the image starts and serves before anything is published: a
      # container that cannot answer /healthz is not worth deploying.
      - name: The image actually runs
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e DASHBOARD_TOKEN=smoke-token \
            '${{ steps.name.outputs.image }}:${{ github.sha }}' \
            node bin/selfcheck.mjs
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "${ready:-0}" != "1" ]; then echo '::error::the image never became healthy'; docker logs smoke; exit 1; fi
          curl -fsS http://127.0.0.1:8080/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          [ "$code" = "401" ] || { echo "::error::dashboard served without a token (got $code)"; exit 1; }
          echo "healthy, and the dashboard is closed without a token"
          docker rm -f smoke

      - name: Publish
        run: |
          docker push '${{ steps.name.outputs.image }}:main'
          docker push '${{ steps.name.outputs.image }}:${{ github.sha }}'

  server:
    name: Roll it out
    needs: image
    runs-on: ubuntu-latest
    # Skipped entirely until the repository has a server to deploy to, so the
    # workflow is green from the first push rather than red until configured.
    if: vars.DEPLOY_HOST != ''
    environment: production
    steps:
      - name: Reach the server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo '::error::DEPLOY_HOST is set but DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS are not — see README «Deploying»'
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned rather than trusted blindly: StrictHostKeyChecking=no would
          # hand the session to whoever answers on that address.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # TEMPORARY (debugging the 255 on erfan@95.156.253.107): reports which
      # stage the connection dies at instead of leaving "Connection closed" to
      # be guessed at. Never fails the job — the real step below still gates.
      - name: Diagnose the connection
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          echo '--- tcp/22 reachable? ---'
          if timeout 20 bash -c "cat < /dev/null > /dev/tcp/${HOST}/22"; then
            echo 'tcp/22 accepts connections'
          else
            echo 'tcp/22 refused, filtered, or timed out'
          fi
          echo '--- ssh -vvv, non-fatal ---'
          set +e
          ssh -vvv -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
            "${USER:-root}@${HOST}" 'echo ssh-ok; id; docker --version' 2>&1 | tail -70
          echo "ssh exit status: ${PIPESTATUS[0]}"
          set -e

      - name: Pull and restart
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          DIR: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.image.outputs.image }}:main
          PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "${USER:-root}@${HOST}" \
            "set -eu; cd '${DIR:-/opt/telegram-live-location}'; \
             export IMAGE='${IMAGE}' PORT='${PORT:-8080}'; \
             docker compose pull; \
             docker compose up -d --remove-orphans; \
             docker image prune -f"

      - name: Check it came back
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          ok=0
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "${USER:-root}@${HOST}" \
                 "curl -fsS http://127.0.0.1:${PORT:-8080}/healthz"; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo '::error::the service did not come back healthy'; exit 1; }
