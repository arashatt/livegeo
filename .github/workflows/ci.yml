name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json; 22 is what the image runs.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      # The service is started by `node src/index.js` with no build step, so
      # the cheapest guard against a broken import is to load every module.
      - name: Modules load
        run: |
          node --input-type=module -e "
            await import('./src/config.js');
            await import('./src/positions.js');
            await import('./src/server.js');
            await import('./src/mtproto.js');
            await import('./src/bot.js');
            await import('./src/login.js');
            await import('./src/circles.js');
            await import('./src/devices.js');
            await import('./src/ingest.js');
            await import('./src/fences.js');
            console.log('all modules load');
          "

      # A missing variable should be a clear message at startup, not a crash
      # somewhere later, and not a service that starts anyway. There are three
      # ways to be half-configured and each has to name what is missing.
      - name: Startup refuses an incomplete environment
        run: |
          set -e
          refuses() {
            local want="$1"; shift
            local output code
            set +e
            output=$(env -u BOT_TOKEN -u TELEGRAM_SESSION -u TELEGRAM_API_ID \
                         -u TELEGRAM_API_HASH -u DASHBOARD_TOKEN -u DASHBOARD_USERS \
                         "$@" node src/index.js 2>&1)
            code=$?
            set -e
            echo "--- $* -> $output"
            if [ $code -eq 0 ]; then echo "::error::started without $want"; exit 1; fi
            echo "$output" | grep -q "$want" \
              || { echo "::error::expected a message naming '$want'"; exit 1; }
          }

          # Nothing at all: it should say how locations are meant to arrive.
          refuses "neither BOT_TOKEN nor TELEGRAM_SESSION"
          # A way in, but nothing deciding who may look at the map.
          refuses "DASHBOARD_TOKEN" BOT_TOKEN=123:stub
          # The account ingest still needs its own credentials.
          refuses "TELEGRAM_API_ID is not set" TELEGRAM_SESSION=stub DASHBOARD_TOKEN=stub
