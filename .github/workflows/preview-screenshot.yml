name: Preview screenshot

on:
  push:
    branches: [chatgpt/mature-map-redesign]
    paths-ignore:
      - 'docs/livegeo-redesign-preview.png'

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start selfcheck server
        run: |
          DASHBOARD_TOKEN=selfcheck node bin/selfcheck.mjs > /tmp/livegeo-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/livegeo-server.log
          exit 1
      - name: Capture desktop preview
        run: |
          cat > screenshot-preview.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:8080/?token=selfcheck', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(5000);
          await page.screenshot({ path: '/tmp/livegeo-preview.png', fullPage: true });
          await browser.close();
          EOF
          node screenshot-preview.mjs
          rm screenshot-preview.mjs
      - name: Save preview on branch
        run: |
          mkdir -p docs
          cp /tmp/livegeo-preview.png docs/livegeo-redesign-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/livegeo-redesign-preview.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update redesign preview screenshot"
          git push
